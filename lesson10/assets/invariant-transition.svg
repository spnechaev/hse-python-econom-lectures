<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="675" viewBox="0 0 1100 675" role="img" aria-labelledby="title desc"><title id="title">Проверка изменения состояния</title><desc id="desc">Метод сначала проверяет сумму и доступное количество. Успешный путь изменяет состояние; отказ поднимает ValueError до изменения.</desc><rect width="1100" height="675" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" text-anchor="start" font-weight="600" fill="#243247">Сначала проверить, затем изменить</text><rect x="50" y="105" width="1000" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="70" y="142" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Исходное состояние: quantity = 6</text><text x="70" y="177" font-size="20" text-anchor="start" font-weight="400" fill="#243247">Нужно списать amount; результат должен оставаться неотрицательным</text><path d="M550 205 L550 270" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="550,270 544.0,258.0 556.0,258.0" fill="#2459a6"/><rect x="300" y="275" width="500" height="105" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="320" y="312" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Проверки метода remove</text><text x="320" y="347" font-size="20" text-anchor="start" font-weight="400" fill="#243247">amount &gt; 0 и amount &lt;= quantity</text><path d="M420 380 L280 455" fill="none" stroke="#246954" stroke-width="3"/><polygon points="280,455 287.7444311652529,444.0444632296423 293.4110881154379,454.62222286998764" fill="#246954"/><path d="M680 380 L820 455" fill="none" stroke="#a93832" stroke-width="3"/><polygon points="820,455 806.5889118845622,454.62222286998764 812.2555688347471,444.0444632296423" fill="#a93832"/><rect x="50" y="460" width="450" height="110" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="70" y="497" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Проверки прошли: amount = 2</text><text x="70" y="532" font-size="20" text-anchor="start" font-weight="400" fill="#243247">Изменить quantity: 6 → 4</text><rect x="600" y="460" width="450" height="110" rx="14" fill="#fcefeb" stroke="#a93832" stroke-width="2"/><text x="620" y="497" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Отказ: amount = 100</text><text x="620" y="532" font-size="20" text-anchor="start" font-weight="400" fill="#243247">ValueError; quantity остаётся 6</text><text x="550" y="630" font-size="23" text-anchor="middle" font-weight="400" fill="#243247">Сохранность при отказе обеспечивает порядок действий в коде метода.</text></g></svg>
