<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="545" viewBox="0 0 1100 545" role="img" aria-labelledby="title desc"><title id="title">Объект в параметре self</title><desc id="desc">При вызове left.add экземпляр left автоматически становится self. Сохранённый связанный метод помнит тот же объект.</desc><rect width="1100" height="545" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" text-anchor="start" font-weight="600" fill="#243247">Связанный метод передаёт нужный экземпляр</text><rect x="50" y="110" width="410" height="105" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="70" y="147" font-size="24" text-anchor="start" font-weight="600" fill="#243247">left.add(3)</text><text x="70" y="182" font-size="20" text-anchor="start" font-weight="400" fill="#243247">Вызов через экземпляр</text><path d="M460 162 L595 162" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="595,162 583.0,168.0 583.0,156.0" fill="#2459a6"/><rect x="600" y="110" width="450" height="105" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="620" y="147" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Counter.add(left, 3)</text><text x="620" y="182" font-size="20" text-anchor="start" font-weight="400" fill="#243247">Эквивалент для обычного метода</text><path d="M820 215 L820 300" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="820,300 814.0,288.0 826.0,288.0" fill="#2459a6"/><rect x="600" y="305" width="450" height="115" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="620" y="342" font-size="24" text-anchor="start" font-weight="600" fill="#243247">def add(self, amount)</text><text x="620" y="377" font-size="20" text-anchor="start" font-weight="400" fill="#243247">self → left, amount → 3</text><rect x="50" y="305" width="410" height="115" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="70" y="342" font-size="24" text-anchor="start" font-weight="600" fill="#243247">saved_add = left.add</text><text x="70" y="377" font-size="20" text-anchor="start" font-weight="400" fill="#243247">Сохраняет связь с тем же left</text><path d="M460 362 L595 362" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="595,362 583.0,368.0 583.0,356.0" fill="#2459a6"/><text x="550" y="500" font-size="22" text-anchor="middle" font-weight="400" fill="#243247">self.value относится к переданному объекту. Отдельно передавать self не нужно.</text></g></svg>
