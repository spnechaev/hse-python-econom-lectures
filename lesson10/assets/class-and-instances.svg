<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc"><title id="title">Класс и отдельные экземпляры</title><desc id="desc">Counter задаёт общую настройку и методы. Два вызова Counter создают отдельные экземпляры со своими атрибутами value.</desc><rect width="1100" height="550" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" text-anchor="start" font-weight="600" fill="#243247">Один класс, два экземпляра, два состояния</text><rect x="300" y="105" width="500" height="105" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="320" y="142" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Класс Counter</text><text x="320" y="177" font-size="20" text-anchor="start" font-weight="400" fill="#243247">Общая настройка unit, методы __init__ и add</text><path d="M450 210 L280 315" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="280,315 287.05661868398005,303.58929744718125 293.362533252643,313.7988734154927" fill="#2459a6"/><path d="M650 210 L820 315" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="820,315 806.637466747357,313.7988734154927 812.94338131602,303.58929744718125" fill="#2459a6"/><rect x="50" y="320" width="450" height="115" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="70" y="357" font-size="24" text-anchor="start" font-weight="600" fill="#243247">left → первый экземпляр</text><text x="70" y="392" font-size="20" text-anchor="start" font-weight="400" fill="#243247">Собственный атрибут value = 12</text><rect x="600" y="320" width="450" height="115" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="620" y="357" font-size="24" text-anchor="start" font-weight="600" fill="#243247">right → второй экземпляр</text><text x="620" y="392" font-size="20" text-anchor="start" font-weight="400" fill="#243247">Собственный атрибут value = 1</text><text x="550" y="505" font-size="23" text-anchor="middle" font-weight="400" fill="#243247">Методы описаны в классе; текущие значения принадлежат экземплярам.</text></g></svg>
