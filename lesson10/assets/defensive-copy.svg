<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="585" viewBox="0 0 1100 585" role="img" aria-labelledby="title desc"><title id="title">Две границы копирования коллекции</title><desc id="desc">Конструктор EventLog копирует переданный список. Свойство entries возвращает новую поверхностную копию. Строковые элементы не требуют глубокого копирования.</desc><rect width="1100" height="585" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" text-anchor="start" font-weight="600" fill="#243247">Копии защищают границы внутреннего списка</text><rect x="50" y="110" width="320" height="110" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="70" y="147" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Входной список</text><text x="70" y="182" font-size="20" text-anchor="start" font-weight="400" fill="#243247">source_entries = [&quot;открыт&quot;]</text><path d="M370 165 L425 165" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="425,165 413.0,171.0 413.0,159.0" fill="#2459a6"/><rect x="430" y="110" width="620" height="110" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="450" y="147" font-size="24" text-anchor="start" font-weight="600" fill="#243247">EventLog.__init__</text><text x="450" y="182" font-size="20" text-anchor="start" font-weight="400" fill="#243247">self._entries = entries.copy()</text><text x="390" y="270" font-size="23" text-anchor="start" font-weight="400" fill="#243247">Изменение входного списка не меняет внутренний.</text><rect x="50" y="355" width="500" height="115" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="70" y="392" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Внутреннее состояние журнала</text><text x="70" y="427" font-size="20" text-anchor="start" font-weight="400" fill="#243247">Изменяется методом record</text><path d="M550 412 L625 412" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="625,412 613.0,418.0 613.0,406.0" fill="#2459a6"/><rect x="630" y="355" width="420" height="115" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="650" y="392" font-size="24" text-anchor="start" font-weight="600" fill="#243247">log.entries → новая копия</text><text x="650" y="427" font-size="20" text-anchor="start" font-weight="400" fill="#243247">Снимок для вызывающего кода</text><text x="550" y="540" font-size="22" text-anchor="middle" font-weight="400" fill="#243247">Изменение снимка не меняет журнал; элементы здесь — неизменяемые строки.</text></g></svg>
