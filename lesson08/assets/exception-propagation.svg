<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Распространение исключения</title><desc id="desc">Вызов идёт через total_quantity к parse_item_basic. ValueError возвращается по цепочке вызовов к внешнему except.</desc><rect width="1100" height="580" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" fill="#243247" text-anchor="start" font-weight="600">Вызовы идут внутрь, исключение — наружу</text><rect x="50" y="95" width="460" height="95" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="72" y="133" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Вызывающий код</text><text x="72" y="167" font-size="19" fill="#243247" text-anchor="start" font-weight="400">try: total_quantity(lines)</text><rect x="130" y="240" width="460" height="95" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="152" y="278" font-size="24" fill="#243247" text-anchor="start" font-weight="600">total_quantity</text><text x="152" y="312" font-size="19" fill="#243247" text-anchor="start" font-weight="400">parse_item_basic(line)</text><rect x="210" y="385" width="460" height="95" rx="14" fill="#fcefeb" stroke="#a93832" stroke-width="2"/><text x="232" y="423" font-size="24" fill="#243247" text-anchor="start" font-weight="600">parse_item_basic</text><text x="232" y="457" font-size="19" fill="#243247" text-anchor="start" font-weight="400">int(&quot;много&quot;) → ValueError</text><path d="M 100 190 L 180 240" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="180,240 166.64402671191985,238.72800254399237 173.00401399195803,228.55202289593132" fill="#2459a6"/><path d="M 180 335 L 260 385" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="260,385 246.64402671191985,383.7280025439923 253.00401399195803,373.5520228959313" fill="#2459a6"/><path d="M 670 430 H 710 V 145" stroke="#a93832" stroke-width="3" fill="none"/><text x="740" y="290" font-size="21" fill="#a93832" text-anchor="start" font-weight="400">Нет обработчика</text><text x="740" y="322" font-size="21" fill="#a93832" text-anchor="start" font-weight="400">внутри функций</text><rect x="740" y="95" width="310" height="95" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="762" y="133" font-size="24" fill="#243247" text-anchor="start" font-weight="600">except ValueError</text><text x="762" y="167" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Здесь выбираем реакцию</text><path d="M 710 145 L 735 145" stroke="#a93832" stroke-width="3" fill="none"/><polygon points="735,145 723.0,151.0 723.0,139.0" fill="#a93832"/><text x="50" y="540" font-size="23" fill="#243247" text-anchor="start" font-weight="400">Функции со сбоем не возвращают обычный результат.</text></g></svg>
