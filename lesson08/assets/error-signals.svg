<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Возврат ошибки и исключение</title><desc id="desc">Специальное значение и статус с errno сохраняют обычный возврат и требуют явной проверки. Исключение не возвращает обычного результата и начинает поиск обработчика; без него выполнение останавливается.</desc><rect width="1100" height="650" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" fill="#243247" text-anchor="start" font-weight="600">Если обработку ошибки не написать</text><rect x="40" y="110" width="300" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="62" y="148" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Спецзначение</text><text x="62" y="182" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Например, -1 или None</text><path d="M 340 160 L 400 160" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="400,160 388.0,166.0 388.0,154.0" fill="#2459a6"/><rect x="405" y="110" width="300" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="427" y="148" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Обычный возврат</text><text x="427" y="182" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Проверка нужна в коде</text><path d="M 705 160 L 765 160" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="765,160 753.0,166.0 753.0,154.0" fill="#2459a6"/><rect x="770" y="110" width="290" height="100" rx="14" fill="#fcefeb" stroke="#a93832" stroke-width="2"/><text x="792" y="148" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Следующая команда</text><text x="792" y="182" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Может выдать неверный итог</text><rect x="40" y="280" width="300" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="62" y="318" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Статус / errno</text><text x="62" y="352" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Отказ и причина отдельно</text><path d="M 340 330 L 400 330" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="400,330 388.0,336.0 388.0,324.0" fill="#2459a6"/><rect x="405" y="280" width="300" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="427" y="318" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Обычный возврат</text><text x="427" y="352" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Проверка нужна в коде</text><path d="M 705 330 L 765 330" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="765,330 753.0,336.0 753.0,324.0" fill="#2459a6"/><rect x="770" y="280" width="290" height="100" rx="14" fill="#fcefeb" stroke="#a93832" stroke-width="2"/><text x="792" y="318" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Следующая команда</text><text x="792" y="352" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Может выдать неверный итог</text><rect x="40" y="450" width="300" height="100" rx="14" fill="#eef3fb" stroke="#a93832" stroke-width="2"/><text x="62" y="488" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Исключение</text><text x="62" y="522" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Нет успешного результата</text><path d="M 340 500 L 400 500" stroke="#a93832" stroke-width="3" fill="none"/><polygon points="400,500 388.0,506.0 388.0,494.0" fill="#a93832"/><rect x="405" y="450" width="300" height="100" rx="14" fill="#eef3fb" stroke="#a93832" stroke-width="2"/><text x="427" y="488" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Выход с ошибкой</text><text x="427" y="522" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Нет обычного результата</text><path d="M 705 500 L 765 500" stroke="#a93832" stroke-width="3" fill="none"/><polygon points="765,500 753.0,506.0 753.0,494.0" fill="#a93832"/><rect x="770" y="450" width="290" height="100" rx="14" fill="#fcefeb" stroke="#a93832" stroke-width="2"/><text x="792" y="488" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Поиск обработчика</text><text x="792" y="522" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Без него — остановка</text><text x="550" y="615" font-size="22" fill="#243247" text-anchor="middle" font-weight="400">Специальный результат проверяет код. Исключение само меняет ход выполнения.</text></g></svg>
