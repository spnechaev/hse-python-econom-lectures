<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">Обработчик с новым исключением и без него</title><desc id="desc">После ValueError обработчик может закончиться обычным образом, и тогда выполняется код после конструкции. Если в обработчике возникает RuntimeError, код после конструкции пропускается и Python ищет внешний обработчик. Соседний except RuntimeError той же конструкции новое исключение не ловит.</desc><rect width="1100" height="720" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" fill="#243247" text-anchor="start" font-weight="600">Что происходит после входа в except</text><text x="295" y="108" font-size="24" fill="#246954" text-anchor="middle" font-weight="600">Обработчик завершился</text><text x="805" y="108" font-size="24" fill="#a93832" text-anchor="middle" font-weight="600">Обработчик сам выбросил ошибку</text><rect x="60" y="145" width="470" height="95" rx="14" fill="#fcefeb" stroke="#a93832" stroke-width="2"/><text x="82" y="183" font-size="24" fill="#243247" text-anchor="start" font-weight="600">В try возник ValueError</text><text x="82" y="217" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Остаток try не выполняется</text><path d="M 295 240 L 295 290" stroke="#a93832" stroke-width="3" fill="none"/><polygon points="295,290 289.0,278.0 301.0,278.0" fill="#a93832"/><rect x="570" y="145" width="470" height="95" rx="14" fill="#fcefeb" stroke="#a93832" stroke-width="2"/><text x="592" y="183" font-size="24" fill="#243247" text-anchor="start" font-weight="600">В try возник ValueError</text><text x="592" y="217" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Остаток try не выполняется</text><path d="M 805 240 L 805 290" stroke="#a93832" stroke-width="3" fill="none"/><polygon points="805,290 799.0,278.0 811.0,278.0" fill="#a93832"/><rect x="60" y="295" width="470" height="130" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="82" y="333" font-size="24" fill="#243247" text-anchor="start" font-weight="600">except ValueError:</text><text x="82" y="367" font-size="19" fill="#243247" text-anchor="start" font-weight="400">    print(&quot;Ошибка ввода&quot;)</text><text x="82" y="400" font-size="21" fill="#246954" text-anchor="start" font-weight="400">Конец обработчика, новой ошибки нет</text><rect x="570" y="295" width="470" height="130" rx="14" fill="#fcefeb" stroke="#a93832" stroke-width="2"/><text x="592" y="333" font-size="24" fill="#243247" text-anchor="start" font-weight="600">except ValueError:</text><text x="592" y="367" font-size="19" fill="#243247" text-anchor="start" font-weight="400">    raise RuntimeError(&quot;Импорт прерван&quot;)</text><text x="592" y="400" font-size="21" fill="#a93832" text-anchor="start" font-weight="400">Появилось новое исключение</text><path d="M 295 425 L 295 490" stroke="#246954" stroke-width="3" fill="none"/><polygon points="295,490 289.0,478.0 301.0,478.0" fill="#246954"/><path d="M 805 425 L 805 490" stroke="#a93832" stroke-width="3" fill="none"/><polygon points="805,490 799.0,478.0 811.0,478.0" fill="#a93832"/><rect x="60" y="495" width="470" height="95" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="82" y="533" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Код после конструкции</text><text x="82" y="567" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Выполняется</text><rect x="570" y="495" width="470" height="95" rx="14" fill="#fcefeb" stroke="#a93832" stroke-width="2"/><text x="592" y="533" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Поиск внешнего обработчика</text><text x="592" y="567" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Код после конструкции пропущен</text><text x="550" y="645" font-size="23" fill="#243247" text-anchor="middle" font-weight="400">Соседний except RuntimeError этой же конструкции не сработает:</text><text x="550" y="681" font-size="23" fill="#243247" text-anchor="middle" font-weight="400">он ловит ошибки из try, а не из другого except.</text></g></svg>
