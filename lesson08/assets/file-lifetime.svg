<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="705" viewBox="0 0 1100 705" role="img" aria-labelledby="title desc"><title id="title">Время жизни файла в with</title><desc id="desc">После успешного входа файл открыт в теле блока; конец блока, return и исключение вызывают закрытие. Ошибка продолжает распространяться.</desc><rect width="1100" height="705" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" fill="#243247" text-anchor="start" font-weight="600">with ограничивает время жизни открытого файла</text><rect x="50" y="100" width="1000" height="90" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="72" y="138" font-size="24" fill="#243247" text-anchor="start" font-weight="600">with open(path, encoding=&quot;utf-8&quot;) as source:</text><text x="72" y="172" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Войти в контекст и получить файловый объект</text><path d="M 550 190 L 550 235" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="550,235 544.0,223.0 556.0,223.0" fill="#2459a6"/><rect x="140" y="240" width="820" height="120" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="162" y="278" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Тело блока: файл открыт</text><text x="162" y="312" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Читаем строки, разбираем данные, получаем результат</text><path d="M 550 360 L 210 415" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="210,415 220.8878757213664,407.1607294806162 222.80414184832688,419.00673826546284" fill="#2459a6"/><text x="210" y="445" font-size="23" fill="#243247" text-anchor="middle" font-weight="400">Конец блока</text><path d="M 210 460 L 550 515" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="550,515 537.1958581516732,519.0067382654628 539.1121242786336,507.16072948061617" fill="#2459a6"/><path d="M 550 360 L 550 415" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="550,415 544.0,403.0 556.0,403.0" fill="#2459a6"/><text x="550" y="445" font-size="23" fill="#243247" text-anchor="middle" font-weight="400">return</text><path d="M 550 460 L 550 515" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="550,515 544.0,503.0 556.0,503.0" fill="#2459a6"/><path d="M 550 360 L 890 415" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="890,415 877.1958581516732,419.00673826546284 879.1121242786336,407.1607294806162" fill="#2459a6"/><text x="890" y="445" font-size="23" fill="#243247" text-anchor="middle" font-weight="400">Исключение</text><path d="M 890 460 L 550 515" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="550,515 560.8878757213664,507.16072948061617 562.8041418483268,519.0067382654628" fill="#2459a6"/><rect x="300" y="520" width="500" height="95" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="322" y="558" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Действие выхода: закрыть файл</text><text x="322" y="592" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Затем продолжить выбранный путь</text><text x="550" y="665" font-size="22" fill="#243247" text-anchor="middle" font-weight="400">Файловый менеджер не подавляет ошибку и не отменяет сделанную запись.</text></g></svg>
