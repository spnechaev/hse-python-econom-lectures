<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Три пути через finally</title><desc id="desc">Успех, return и исключение проходят через finally, затем каждый путь продолжается своим способом при успешном завершающем действии.</desc><rect width="1100" height="650" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" fill="#243247" text-anchor="start" font-weight="600">finally выполняется перед продолжением выхода</text><rect x="45" y="100" width="290" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="67" y="138" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Конец try</text><text x="67" y="172" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Обычный путь</text><path d="M 190 200 L 550 275" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="550,275 537.0285094384768,278.4264314690816 539.4759604878208,266.6786664322304" fill="#2459a6"/><rect x="405" y="100" width="290" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="427" y="138" font-size="24" fill="#243247" text-anchor="start" font-weight="600">return result</text><text x="427" y="172" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Возврат результата</text><path d="M 550 200 L 550 275" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="550,275 544.0,263.0 556.0,263.0" fill="#2459a6"/><rect x="765" y="100" width="290" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="787" y="138" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Исключение</text><text x="787" y="172" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Выход с ошибкой</text><path d="M 910 200 L 550 275" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="550,275 560.5240395121792,266.6786664322304 562.9714905615232,278.4264314690816" fill="#2459a6"/><rect x="355" y="280" width="390" height="100" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="377" y="318" font-size="24" fill="#243247" text-anchor="start" font-weight="600">finally</text><text x="377" y="352" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Завершающее действие</text><path d="M 550 380 L 190 455" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="190,455 200.52403951217926,446.6786664322304 202.97149056152327,458.4264314690816" fill="#2459a6"/><rect x="45" y="460" width="290" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="67" y="498" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Продолжить</text><text x="67" y="532" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Следующая команда</text><path d="M 550 380 L 550 455" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="550,455 544.0,443.0 556.0,443.0" fill="#2459a6"/><rect x="405" y="460" width="290" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="427" y="498" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Вернуть result</text><text x="427" y="532" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Вызывающему коду</text><path d="M 550 380 L 910 455" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="910,455 897.0285094384768,458.4264314690816 899.4759604878208,446.6786664322304" fill="#2459a6"/><rect x="765" y="460" width="290" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="787" y="498" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Передать ошибку</text><text x="787" y="532" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Внешнему обработчику</text><text x="550" y="615" font-size="21" fill="#243247" text-anchor="middle" font-weight="400">Если finally сам завершился без нового исключения или другого выхода</text></g></svg>
