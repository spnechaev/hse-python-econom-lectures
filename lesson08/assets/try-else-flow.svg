<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="745" viewBox="0 0 1100 745" role="img" aria-labelledby="title desc"><title id="title">Когда выполняется else</title><desc id="desc">Два пути: после обычного завершения try выполняется else, а except пропускается. После ValueError выполняется обработчик, а else пропускается. Если обработчик завершился обычным образом, оба пути доходят до кода после конструкции. Выход из try через return, break или continue пропускает else.</desc><rect width="1100" height="745" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" fill="#243247" text-anchor="start" font-weight="600">else: работа только после успешного try</text><text x="295" y="108" font-size="24" fill="#246954" text-anchor="middle" font-weight="600">try завершился без ошибки</text><text x="805" y="108" font-size="24" fill="#a93832" text-anchor="middle" font-weight="600">В try возник ValueError</text><rect x="60" y="145" width="470" height="95" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="82" y="183" font-size="24" fill="#243247" text-anchor="start" font-weight="600">try</text><text x="82" y="217" font-size="19" fill="#243247" text-anchor="start" font-weight="400">quantity = int(text)</text><path d="M 295 240 L 295 275" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="295,275 289.0,263.0 301.0,263.0" fill="#2459a6"/><rect x="60" y="280" width="470" height="95" rx="14" fill="#f1f1ef" stroke="#8d939c" stroke-width="2"/><text x="82" y="318" font-size="24" fill="#243247" text-anchor="start" font-weight="600">except пропущен</text><text x="82" y="352" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Обрабатывать нечего</text><path d="M 295 375 L 295 410" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="295,410 289.0,398.0 301.0,398.0" fill="#2459a6"/><rect x="60" y="415" width="470" height="95" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="82" y="453" font-size="24" fill="#243247" text-anchor="start" font-weight="600">else выполняется</text><text x="82" y="487" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Сохраняем корректный результат</text><path d="M 295 510 L 295 545" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="295,545 289.0,533.0 301.0,533.0" fill="#2459a6"/><rect x="60" y="550" width="470" height="95" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="82" y="588" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Код после конструкции</text><text x="82" y="622" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Продолжаем работу</text><rect x="570" y="145" width="470" height="95" rx="14" fill="#fcefeb" stroke="#a93832" stroke-width="2"/><text x="592" y="183" font-size="24" fill="#243247" text-anchor="start" font-weight="600">try прерван</text><text x="592" y="217" font-size="19" fill="#243247" text-anchor="start" font-weight="400">int(text) не вернул число</text><path d="M 805 240 L 805 275" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="805,275 799.0,263.0 811.0,263.0" fill="#2459a6"/><rect x="570" y="280" width="470" height="95" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="592" y="318" font-size="24" fill="#243247" text-anchor="start" font-weight="600">except ValueError</text><text x="592" y="352" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Сообщили об ошибке; закончили</text><path d="M 805 375 L 805 410" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="805,410 799.0,398.0 811.0,398.0" fill="#2459a6"/><rect x="570" y="415" width="470" height="95" rx="14" fill="#f1f1ef" stroke="#8d939c" stroke-width="2"/><text x="592" y="453" font-size="24" fill="#243247" text-anchor="start" font-weight="600">else пропущен</text><text x="592" y="487" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Успешного результата нет</text><path d="M 805 510 L 805 545" stroke="#2459a6" stroke-width="3" fill="none"/><polygon points="805,545 799.0,533.0 811.0,533.0" fill="#2459a6"/><rect x="570" y="550" width="470" height="95" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="592" y="588" font-size="24" fill="#243247" text-anchor="start" font-weight="600">Код после конструкции</text><text x="592" y="622" font-size="19" fill="#243247" text-anchor="start" font-weight="400">Ошибка обработана, идём дальше</text><text x="550" y="706" font-size="22" fill="#243247" text-anchor="middle" font-weight="400">return, break и continue внутри try тоже пропускают else.</text></g></svg>
