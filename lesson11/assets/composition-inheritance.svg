<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Композиция и наследование</title><desc id="desc">При композиции Checkout хранит отдельный объект доставки. При наследовании TrackedLabel является подклассом ShippingLabel и должен сохранять обещания, нужные клиентам базового типа.</desc><rect width="1100" height="650" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="50" fill="#243247" font-size="31" text-anchor="start" font-weight="600">Два разных отношения между классами</text><text x="55" y="110" fill="#243247" font-size="25" text-anchor="start" font-weight="600">Композиция: пользуется помощником</text><rect x="55" y="140" width="390" height="135" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="75" y="176" fill="#2459a6" font-size="25" text-anchor="start" font-weight="600">Checkout</text><text x="75" y="212" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Хранит ссылку _delivery</text><text x="75" y="242" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Вызывает price(order)</text><rect x="655" y="140" width="390" height="135" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="675" y="176" fill="#246954" font-size="25" text-anchor="start" font-weight="600">Courier или Pickup</text><text x="675" y="212" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Отдельный объект</text><text x="675" y="242" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Свой способ расчёта</text><path d="M450 205 L650 205" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="650,205 637.0,211.0 637.0,199.0" fill="#2459a6"/><text x="550" y="315" fill="#243247" font-size="23" text-anchor="middle" font-weight="400">Можно передать другого помощника.</text><text x="55" y="390" fill="#243247" font-size="25" text-anchor="start" font-weight="600">Наследование: подходит на место базового типа</text><rect x="55" y="425" width="390" height="135" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="75" y="461" fill="#2459a6" font-size="25" text-anchor="start" font-weight="600">ShippingLabel</text><text x="75" y="497" fill="#243247" font-size="21" text-anchor="start" font-weight="400">text() и render()</text><text x="75" y="527" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Обещают вернуть строки</text><rect x="655" y="425" width="390" height="135" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="675" y="461" fill="#246954" font-size="25" text-anchor="start" font-weight="600">TrackedLabel</text><text x="675" y="497" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Переопределяет text()</text><text x="675" y="527" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Сохраняет общий договор</text><path d="M650 490 L450 490" fill="none" stroke="#246954" stroke-width="3"/><polygon points="450,490 463.0,484.0 463.0,496.0" fill="#246954"/><text x="550" y="610" fill="#243247" font-size="23" text-anchor="middle" font-weight="400">Общий код не заменяет проверку пригодности наследника.</text></g></svg>
