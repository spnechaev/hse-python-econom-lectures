<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Сборка зависимостей</title><desc id="desc">Checkout зависит от небольшого договора price(order). Конкретный объект доставки выбирается снаружи. Pickup, Courier и RecordingDelivery выполняют нужный договор; подставной объект позволяет проверить расчёт локально.</desc><rect width="1100" height="650" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="50" fill="#243247" font-size="30" text-anchor="start" font-weight="600">Конкретные объекты выбираются в месте сборки</text><rect x="50" y="110" width="300" height="130" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="70" y="146" fill="#2459a6" font-size="25" text-anchor="start" font-weight="600">main</text><text x="70" y="182" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Создаёт заказ и доставку</text><text x="70" y="212" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Передаёт их в расчёт</text><rect x="420" y="110" width="630" height="130" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="440" y="146" fill="#2459a6" font-size="25" text-anchor="start" font-weight="600">Checkout</text><text x="440" y="182" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Требует price(order) → целое число копеек</text><text x="440" y="212" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Не называет класс конкретной доставки</text><path d="M355 175 L415 175" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="415,175 402.0,181.0 402.0,169.0" fill="#2459a6"/><text x="50" y="300" fill="#243247" font-size="24" text-anchor="start" font-weight="600">Договор выполняют:</text><rect x="50" y="370" width="290" height="130" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="70" y="406" fill="#246954" font-size="25" text-anchor="start" font-weight="600">Pickup</text><text x="70" y="442" fill="#243247" font-size="21" text-anchor="start" font-weight="400">0 копеек</text><path d="M195 365 L735 245" fill="none" stroke="#246954" stroke-width="3"/><polygon points="735,245 723.6111509645204,253.67721831274625 721.0079854706967,241.96297359053884" fill="#246954"/><rect x="405" y="370" width="290" height="130" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="425" y="406" fill="#246954" font-size="25" text-anchor="start" font-weight="600">Courier</text><text x="425" y="442" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Тариф по весу</text><path d="M550 365 L735 245" fill="none" stroke="#246954" stroke-width="3"/><polygon points="735,245 727.3586498992346,257.10825208845324 720.8283566380463,247.04071664412135" fill="#246954"/><rect x="760" y="370" width="290" height="130" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="780" y="406" fill="#246954" font-size="25" text-anchor="start" font-weight="600">RecordingDelivery</text><text x="780" y="442" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Заранее заданный ответ</text><path d="M905 365 L735 245" fill="none" stroke="#246954" stroke-width="3"/><polygon points="735,245 749.0806814080339,247.59507438919397 742.16048303685,257.3986887483711" fill="#246954"/><text x="550" y="563" fill="#243247" font-size="22" text-anchor="middle" font-weight="400">Реальная доставка и подставной объект нужны одному и тому же клиенту.</text><text x="550" y="603" fill="#243247" font-size="21" text-anchor="middle" font-weight="400">Передать объект — способ связать части; узкий договор задаёт направление связи.</text></g></svg>
