<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Контракт прямоугольника и квадрата</title><desc id="desc">Rectangle.resize принимает произвольные положительные размеры и обязан сохранить оба переданных значения. Квадрат, принудительно делающий стороны равными или запрещающий неравные стороны, этому договору не соответствует. Для клиента, читающего только площадь, подходят отдельные реализации area().</desc><rect width="1100" height="650" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="50" fill="#243247" font-size="31" text-anchor="start" font-weight="600">resize(5, 2): что обещано после успеха?</text><rect x="50" y="110" width="460" height="150" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="70" y="146" fill="#246954" font-size="25" text-anchor="start" font-weight="600">Rectangle</text><text x="70" y="182" fill="#243247" font-size="21" text-anchor="start" font-weight="400">width = 5, height = 2</text><text x="70" y="212" fill="#243247" font-size="21" text-anchor="start" font-weight="400">area() = 10</text><rect x="590" y="110" width="460" height="150" rx="14" fill="#fcefeb" stroke="#a93832" stroke-width="2"/><text x="610" y="146" fill="#a93832" font-size="25" text-anchor="start" font-weight="600">BadSquare</text><text x="610" y="182" fill="#243247" font-size="21" text-anchor="start" font-weight="400">width = 5, height = 5</text><text x="610" y="212" fill="#243247" font-size="21" text-anchor="start" font-weight="400">area() = 25</text><text x="280" y="302" fill="#246954" font-size="24" text-anchor="middle" font-weight="600">Договор выполнен</text><text x="820" y="302" fill="#a93832" font-size="24" text-anchor="middle" font-weight="600">Договор нарушен</text><text x="550" y="363" fill="#243247" font-size="23" text-anchor="middle" font-weight="400">Отказать на (5, 2) — тоже нарушить прежнее обещание.</text><rect x="240" y="420" width="620" height="135" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="260" y="456" fill="#2459a6" font-size="25" text-anchor="start" font-weight="600">Клиенту нужна только площадь?</text><text x="260" y="492" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Отдельные Rectangle и Square умеют area().</text><text x="260" y="522" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Независимое изменение сторон ему не требуется.</text><text x="550" y="610" fill="#243247" font-size="22" text-anchor="middle" font-weight="400">Подстановка зависит от методов и их условий, а не только от названий фигур.</text></g></svg>
