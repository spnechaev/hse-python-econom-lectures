<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="555" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc"><title id="title">Сотрудничество объектов</title><desc id="desc">Заказ хранит стоимость товаров и вес. Checkout передаёт заказ объекту Courier, получает цену доставки и прибавляет её к стоимости товаров. Взаимодействие идёт через price(order).</desc><rect width="1100" height="555" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="50" fill="#243247" font-size="31" text-anchor="start" font-weight="600">Один заказ, несколько самостоятельных ролей</text><rect x="50" y="115" width="300" height="140" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="70" y="151" fill="#2459a6" font-size="25" text-anchor="start" font-weight="600">Order</text><text x="70" y="187" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Товары: 240 000 коп.</text><text x="70" y="217" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Вес: 1 500 г</text><rect x="420" y="115" width="270" height="140" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="440" y="151" fill="#2459a6" font-size="25" text-anchor="start" font-weight="600">Checkout</text><text x="440" y="187" fill="#243247" font-size="21" text-anchor="start" font-weight="400">total(order)</text><text x="440" y="217" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Складывает цены</text><rect x="760" y="115" width="290" height="140" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="780" y="151" fill="#246954" font-size="25" text-anchor="start" font-weight="600">Courier</text><text x="780" y="187" fill="#243247" font-size="21" text-anchor="start" font-weight="400">price(order)</text><text x="780" y="217" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Ответ: 50 000 коп.</text><path d="M350 185 L415 185" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="415,185 402.0,191.0 402.0,179.0" fill="#2459a6"/><path d="M690 155 L755 155" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="755,155 742.0,161.0 742.0,149.0" fill="#2459a6"/><path d="M755 220 L695 220" fill="none" stroke="#246954" stroke-width="3"/><polygon points="695,220 708.0,214.0 708.0,226.0" fill="#246954"/><text x="723" y="293" fill="#243247" font-size="20" text-anchor="middle" font-weight="400">price(order)</text><rect x="385" y="345" width="340" height="110" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="405" y="381" fill="#246954" font-size="25" text-anchor="start" font-weight="600">Результат расчёта</text><text x="405" y="417" fill="#243247" font-size="21" text-anchor="start" font-weight="400">Итого: 290 000 коп.</text><path d="M555 255 L555 340" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="555,340 549.0,327.0 561.0,327.0" fill="#2459a6"/><text x="550" y="515" fill="#243247" font-size="23" text-anchor="middle" font-weight="400">Checkout знает нужный метод, а формулу тарифа хранит доставка.</text></g></svg>
