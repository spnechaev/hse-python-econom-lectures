<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565" role="img">
<title>Игра — состояние, которое меняется каждый кадр</title><desc>Pygame доставляет события и рисует. Правила движения задаёт программа.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63768b"/></marker></defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#203047}.mono{font-family:Menlo,DejaVu Sans Mono,monospace}</style>
<rect width="1200" height="565" rx="20" fill="#f5f7fb"/>
<rect x="32" y="31" width="7" height="62" rx="3" fill="#2764b7"/>
<text x="58" y="57" font-size="30" font-weight="700" style="fill:#203047">Игра — состояние, которое меняется каждый кадр</text>
<text x="58" y="91" font-size="19" font-weight="400" style="fill:#203047">Pygame доставляет события и рисует. Правила движения задаёт программа.</text>
<rect x="80" y="155" width="300" height="143" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="98" y="188" font-size="23" font-weight="700" style="fill:#2764b7">1. События</text>
<text x="98" y="222" font-size="20" font-weight="400" style="fill:#203047">нажата клавиша?</text>
<text x="98" y="251" font-size="20" font-weight="400" style="fill:#203047">закрыто окно?</text>
<polyline points="380,225 475,225" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="475" y="155" width="300" height="143" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="493" y="188" font-size="23" font-weight="700" style="fill:#2764b7">2. Обновление</text>
<text x="493" y="222" font-size="20" font-weight="400" style="fill:#203047">x = x + speed · dt</text>
<text x="493" y="251" font-size="20" font-weight="400" style="fill:#203047">проверить границу</text>
<polyline points="775,225 870,225" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="870" y="155" width="300" height="143" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="888" y="188" font-size="23" font-weight="700" style="fill:#2764b7">3. Рисование</text>
<text x="888" y="222" font-size="20" font-weight="400" style="fill:#203047">очистить экран</text>
<text x="888" y="251" font-size="20" font-weight="400" style="fill:#203047">нарисовать объект</text>
<polyline points="1020,298 1020,334 230,334 230,298" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="490" y="366" font-size="18" font-weight="400" style="fill:#197568">следующий кадр</text>
<rect x="80" y="395" width="1090" height="100" rx="13" fill="#213247"/>
<circle cx="255" cy="445" r="21" fill="#f3bb59" opacity="0.4"/>
<circle cx="725" cy="445" r="21" fill="#f3bb59"/>
<polyline points="290,445 688,445" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="95" y="453" font-size="19" font-weight="400" style="fill:#ffffff" class="mono">x = 20</text>
<text x="775" y="452" font-size="21" font-weight="400" style="fill:#ffffff" class="mono">x = 20 + 60 · 0.1 = 26</text>
<text x="40" y="540" font-size="19" font-weight="400" style="fill:#197568">dt — время между кадрами. Так скорость движения меньше зависит от частоты кадров.</text>
</svg>
