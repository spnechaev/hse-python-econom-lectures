<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img">
<title>Обучить модель ≠ применить модель</title><desc>Пример: оценить длительность поездки по расстоянию.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63768b"/></marker></defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#203047}.mono{font-family:Menlo,DejaVu Sans Mono,monospace}</style>
<rect width="1200" height="540" rx="20" fill="#f5f7fb"/>
<rect x="32" y="31" width="7" height="62" rx="3" fill="#2764b7"/>
<text x="58" y="57" font-size="30" font-weight="700" style="fill:#203047">Обучить модель ≠ применить модель</text>
<text x="58" y="91" font-size="19" font-weight="400" style="fill:#203047">Пример: оценить длительность поездки по расстоянию.</text>
<text x="40" y="139" font-size="17" font-weight="700" style="fill:#2764b7">ОБУЧЕНИЕ</text>
<rect x="40" y="158" width="285" height="132" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="58" y="191" font-size="23" font-weight="700" style="fill:#2764b7">Известные поездки</text>
<text x="58" y="225" font-size="20" font-weight="400" style="fill:#203047">расстояния X</text>
<text x="58" y="254" font-size="20" font-weight="400" style="fill:#203047">реальные длительности y</text>
<rect x="450" y="158" width="250" height="132" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="468" y="191" font-size="23" font-weight="700" style="fill:#2764b7">fit(X, y)</text>
<text x="468" y="225" font-size="20" font-weight="400" style="fill:#203047">подобрать параметры</text>
<text x="468" y="254" font-size="20" font-weight="400" style="fill:#203047">по примерам</text>
<rect x="825" y="158" width="325" height="132" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="843" y="191" font-size="23" font-weight="700" style="fill:#2764b7">Обученная модель</text>
<text x="843" y="225" font-size="20" font-weight="400" style="fill:#203047">хранит найденную</text>
<text x="843" y="254" font-size="20" font-weight="400" style="fill:#203047">зависимость</text>
<polyline points="325,222 450,222" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="700,222 825,222" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="328" font-size="17" font-weight="700" style="fill:#197568">ПРИМЕНЕНИЕ И ПРОВЕРКА</text>
<rect x="40" y="345" width="285" height="117" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="58" y="378" font-size="23" font-weight="700" style="fill:#2764b7">Другая поездка</text>
<text x="58" y="412" font-size="20" font-weight="400" style="fill:#203047">новое расстояние</text>
<rect x="450" y="345" width="250" height="117" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="468" y="378" font-size="23" font-weight="700" style="fill:#2764b7">predict(X_new)</text>
<text x="468" y="412" font-size="20" font-weight="400" style="fill:#203047">использовать модель</text>
<rect x="825" y="345" width="325" height="117" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="843" y="378" font-size="23" font-weight="700" style="fill:#2764b7">Прогноз</text>
<text x="843" y="412" font-size="20" font-weight="400" style="fill:#203047">сравнить с фактом</text>
<polyline points="325,402 450,402" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="700,402 825,402" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="987,290 987,316 575,316 575,345" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="515" font-size="19" font-weight="400" style="fill:#197568">Проверочные примеры не участвуют в обучении: иначе оценка качества будет нечестной.</text>
</svg>
