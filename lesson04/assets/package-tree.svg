<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img">
<title>Пакет содержит подмодули</title><desc>urllib — пакет стандартной библиотеки; parse — модуль для работы с URL.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63768b"/></marker></defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#203047}.mono{font-family:Menlo,DejaVu Sans Mono,monospace}</style>
<rect width="1200" height="530" rx="20" fill="#f5f7fb"/>
<rect x="32" y="31" width="7" height="62" rx="3" fill="#2764b7"/>
<text x="58" y="57" font-size="30" font-weight="700" style="fill:#203047">Пакет содержит подмодули</text>
<text x="58" y="91" font-size="19" font-weight="400" style="fill:#203047">urllib — пакет стандартной библиотеки; parse — модуль для работы с URL.</text>
<rect x="40" y="151" width="480" height="267" rx="14" fill="#eaf1fb" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="58" y="184" font-size="23" font-weight="700" style="fill:#2764b7">Пакет urllib</text>
<text x="72" y="225" font-size="24" font-weight="400" style="fill:#203047" class="mono">urllib/</text>
<text x="72" y="262" font-size="24" font-weight="400" style="fill:#203047" class="mono">├── __init__.py</text>
<text x="72" y="299" font-size="24" font-weight="400" style="fill:#203047" class="mono">├── parse.py</text>
<text x="72" y="336" font-size="24" font-weight="400" style="fill:#203047" class="mono">├── request.py</text>
<text x="72" y="373" font-size="24" font-weight="400" style="fill:#203047" class="mono">└── error.py</text>
<rect x="705" y="151" width="455" height="108" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="723" y="184" font-size="23" font-weight="700" style="fill:#2764b7">import urllib.parse</text>
<text x="723" y="218" font-size="20" font-weight="400" style="fill:#203047">обращение: urllib.parse.urlsplit(...)</text>
<rect x="705" y="310" width="455" height="108" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="723" y="343" font-size="23" font-weight="700" style="fill:#2764b7">from urllib import parse</text>
<text x="723" y="377" font-size="20" font-weight="400" style="fill:#203047">обращение: parse.urlsplit(...)</text>
<polyline points="346,298 610,298 610,205 705,205" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="346,298 610,298 610,364 705,364" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="43" y="468" font-size="24" font-weight="700" style="fill:#203047">import urllib сам по себе не обязан загружать все подмодули пакета.</text>
<text x="40" y="505" font-size="19" font-weight="400" style="fill:#197568">Подмодуль импортируем явно. В обоих вариантах выше загружаются urllib и urllib.parse.</text>
</svg>
