<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="505" viewBox="0 0 1200 505" role="img">
<title>Бот общается с Telegram через API</title><desc>Long polling: программа ждёт новые события и отправляет ответ отдельным запросом.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63768b"/></marker></defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#203047}.mono{font-family:Menlo,DejaVu Sans Mono,monospace}</style>
<rect width="1200" height="505" rx="20" fill="#f5f7fb"/>
<rect x="32" y="31" width="7" height="62" rx="3" fill="#2764b7"/>
<text x="58" y="57" font-size="30" font-weight="700" style="fill:#203047">Бот общается с Telegram через API</text>
<text x="58" y="91" font-size="19" font-weight="400" style="fill:#203047">Long polling: программа ждёт новые события и отправляет ответ отдельным запросом.</text>
<rect x="40" y="180" width="245" height="167" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="58" y="213" font-size="23" font-weight="700" style="fill:#2764b7">Пользователь</text>
<text x="58" y="247" font-size="20" font-weight="400" style="fill:#203047">сообщение: «привет»</text>
<text x="58" y="276" font-size="20" font-weight="400" style="fill:#203047">ответ: «Вы написали:</text>
<text x="58" y="305" font-size="20" font-weight="400" style="fill:#203047">привет»</text>
<rect x="470" y="180" width="260" height="167" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="488" y="213" font-size="23" font-weight="700" style="fill:#2764b7">Сервис Telegram</text>
<text x="488" y="247" font-size="20" font-weight="400" style="fill:#203047">хранит обновления</text>
<text x="488" y="276" font-size="20" font-weight="400" style="fill:#203047">доставляет сообщения</text>
<rect x="900" y="180" width="260" height="167" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="918" y="213" font-size="23" font-weight="700" style="fill:#2764b7">Python-бот</text>
<text x="918" y="247" font-size="20" font-weight="400" style="fill:#203047">читает text и chat_id</text>
<text x="918" y="276" font-size="20" font-weight="400" style="fill:#203047">вычисляет ответ</text>
<polyline points="285,220 470,220" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="318" y="161" font-size="18" font-weight="400" style="fill:#197568">сообщение</text>
<polyline points="900,204 730,204" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="743" y="141" font-size="18" font-weight="400" style="fill:#197568">getUpdates</text>
<polyline points="730,267 900,267" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="747" y="254" font-size="18" font-weight="400" style="fill:#197568">JSON события</text>
<polyline points="900,326 730,326" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="746" y="374" font-size="18" font-weight="400" style="fill:#197568">sendMessage</text>
<polyline points="470,318 285,318" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="328" y="374" font-size="18" font-weight="400" style="fill:#197568">ответ в чат</text>
<text x="43" y="433" font-size="22" font-weight="400" style="fill:#203047">Цикл бота: получить → обработать → ответить → запросить следующие события</text>
<text x="40" y="480" font-size="19" font-weight="400" style="fill:#197568">Вычисления идут в вашей программе. Приложение Telegram служит интерфейсом.</text>
</svg>
