<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img">
<title>Переиспользуем функцию из общего модуля</title><desc>Одна функция нужна двум программам. На схеме — исходные файлы на диске.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63768b"/></marker></defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#203047}.mono{font-family:Menlo,DejaVu Sans Mono,monospace}</style>
<rect width="1200" height="660" rx="20" fill="#f5f7fb"/>
<rect x="32" y="31" width="7" height="62" rx="3" fill="#2764b7"/>
<text x="58" y="57" font-size="30" font-weight="700" style="fill:#203047">Переиспользуем функцию из общего модуля</text>
<text x="58" y="91" font-size="19" font-weight="400" style="fill:#203047">Одна функция нужна двум программам. На схеме — исходные файлы на диске.</text>
<text x="40" y="138" font-size="18" font-weight="700" style="fill:#b86524">КОПИИ В ДВУХ ФАЙЛАХ</text>
<text x="665" y="138" font-size="18" font-weight="700" style="fill:#197568">ОБЩЕЕ ОПРЕДЕЛЕНИЕ</text>
<rect x="40" y="163" width="490" height="144" rx="14" fill="#fff0e3" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="58" y="196" font-size="23" font-weight="700" style="fill:#b86524">program_a.py</text>
<text x="60" y="240" font-size="20" font-weight="400" style="fill:#203047" class="mono">def normalize_spaces(text):</text>
<text x="108" y="273" font-size="20" font-weight="400" style="fill:#203047" class="mono">return &quot; &quot;.join(text.split())</text>
<rect x="40" y="368" width="490" height="144" rx="14" fill="#fff0e3" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="58" y="401" font-size="23" font-weight="700" style="fill:#b86524">program_b.py</text>
<text x="60" y="445" font-size="20" font-weight="400" style="fill:#203047" class="mono">def normalize_spaces(text):</text>
<text x="108" y="478" font-size="20" font-weight="400" style="fill:#203047" class="mono">return &quot; &quot;.join(text.split())</text>
<text x="43" y="554" font-size="22" font-weight="400" style="fill:#203047">Правило записано в двух местах.</text>
<text x="43" y="589" font-size="21" font-weight="400" style="fill:#b86524">Каждую копию нужно исправлять отдельно.</text>
<rect x="665" y="163" width="495" height="144" rx="14" fill="#e7f2ef" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="683" y="196" font-size="23" font-weight="700" style="fill:#197568">text_tools.py</text>
<text x="685" y="240" font-size="20" font-weight="400" style="fill:#203047" class="mono">def normalize_spaces(text):</text>
<text x="733" y="273" font-size="20" font-weight="400" style="fill:#203047" class="mono">return &quot; &quot;.join(text.split())</text>
<rect x="665" y="366" width="495" height="86" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="683" y="399" font-size="23" font-weight="700" style="fill:#2764b7">program_a.py</text>
<text x="685" y="432" font-size="18" font-weight="400" style="fill:#203047" class="mono">from text_tools import normalize_spaces</text>
<rect x="665" y="472" width="495" height="86" rx="14" fill="#ffffff" stroke="#cdd7e4" stroke-width="1.5"/>
<text x="683" y="505" font-size="23" font-weight="700" style="fill:#2764b7">program_b.py</text>
<text x="685" y="538" font-size="18" font-weight="400" style="fill:#203047" class="mono">from text_tools import normalize_spaces</text>
<polyline points="665,409 635,409 635,231 665,231" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="665,515 601,515 601,271 665,271" fill="none" stroke="#63768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="668" y="589" font-size="21" font-weight="400" style="fill:#197568">Правило меняем только в text_tools.py.</text>
<text x="40" y="635" font-size="19" font-weight="400" style="fill:#197568">После правки общего модуля программы используют новую версию при следующем запуске.</text>
</svg>
