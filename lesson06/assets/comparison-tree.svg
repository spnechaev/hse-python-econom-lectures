<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img">
<title>Три различных значения: шесть возможных порядков</title><desc>Лист a b c означает a &lt; b &lt; c: это порядок исходных элементов после сортировки.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63768b"/></marker></defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif}.mono{font-family:Menlo,DejaVu Sans Mono,monospace}</style>
<rect width="1200" height="670" rx="20" fill="#f5f7fb"/>
<text x="40" y="52" font-size="30" fill="#203047" font-weight="700" text-anchor="start" class="">Три различных значения: шесть возможных порядков</text>
<text x="40" y="88" font-size="20" fill="#203047" font-weight="400" text-anchor="start" class="">Лист a b c означает a &lt; b &lt; c: это порядок исходных элементов после сортировки.</text>
<rect x="532.5" y="125" width="135" height="44" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="600" y="154" font-size="21" fill="#203047" font-weight="400" text-anchor="middle" class="mono">a &lt; b?</text>
<path d="M600 170L300 235" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="460.0" y="194.5" font-size="18" fill="#2764b7" font-weight="400" text-anchor="start" class="">да</text>
<rect x="232.5" y="235" width="135" height="44" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="300" y="264" font-size="21" fill="#203047" font-weight="400" text-anchor="middle" class="mono">b &lt; c?</text>
<path d="M600 170L900 235" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="760.0" y="194.5" font-size="18" fill="#2764b7" font-weight="400" text-anchor="start" class="">нет</text>
<rect x="832.5" y="235" width="135" height="44" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="900" y="264" font-size="21" fill="#203047" font-weight="400" text-anchor="middle" class="mono">a &lt; c?</text>
<path d="M300 280L140 355" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="230.0" y="309.5" font-size="18" fill="#2764b7" font-weight="400" text-anchor="start" class="">да</text>
<rect x="72.5" y="355" width="135" height="44" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="140" y="384" font-size="21" fill="#203047" font-weight="400" text-anchor="middle" class="mono">a b c</text>
<path d="M300 280L440 355" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="380.0" y="309.5" font-size="18" fill="#2764b7" font-weight="400" text-anchor="start" class="">нет</text>
<rect x="372.5" y="355" width="135" height="44" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="440" y="384" font-size="21" fill="#203047" font-weight="400" text-anchor="middle" class="mono">a &lt; c?</text>
<path d="M900 280L760 355" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="840.0" y="309.5" font-size="18" fill="#2764b7" font-weight="400" text-anchor="start" class="">да</text>
<rect x="692.5" y="355" width="135" height="44" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="760" y="384" font-size="21" fill="#203047" font-weight="400" text-anchor="middle" class="mono">b a c</text>
<path d="M900 280L1060 355" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="990.0" y="309.5" font-size="18" fill="#2764b7" font-weight="400" text-anchor="start" class="">нет</text>
<rect x="992.5" y="355" width="135" height="44" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="1060" y="384" font-size="21" fill="#203047" font-weight="400" text-anchor="middle" class="mono">b &lt; c?</text>
<path d="M440 400L345 490" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="402.5" y="437.0" font-size="18" fill="#2764b7" font-weight="400" text-anchor="start" class="">да</text>
<rect x="282.5" y="490" width="125" height="44" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="345" y="519" font-size="21" fill="#203047" font-weight="400" text-anchor="middle" class="mono">a c b</text>
<path d="M440 400L530 490" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="495.0" y="437.0" font-size="18" fill="#2764b7" font-weight="400" text-anchor="start" class="">нет</text>
<rect x="467.5" y="490" width="125" height="44" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="530" y="519" font-size="21" fill="#203047" font-weight="400" text-anchor="middle" class="mono">c a b</text>
<path d="M1060 400L960 490" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="1020.0" y="437.0" font-size="18" fill="#2764b7" font-weight="400" text-anchor="start" class="">да</text>
<rect x="897.5" y="490" width="125" height="44" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="960" y="519" font-size="21" fill="#203047" font-weight="400" text-anchor="middle" class="mono">b c a</text>
<path d="M1060 400L1130 490" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="1105.0" y="437.0" font-size="18" fill="#2764b7" font-weight="400" text-anchor="start" class="">нет</text>
<rect x="1067.5" y="490" width="125" height="44" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="1130" y="519" font-size="21" fill="#203047" font-weight="400" text-anchor="middle" class="mono">c b a</text>
<text x="40" y="594" font-size="22" fill="#203047" font-weight="400" text-anchor="start" class="">Не более h сравнений → не более 2ʰ листьев. Нужно различить n! порядков.</text>
<text x="40" y="634" font-size="24" fill="#2764b7" font-weight="700" text-anchor="start" class="">2ʰ ≥ n!  ⇒  h ≥ log₂(n!)  ⇒  Ω(n log n) в худшем случае.</text>
</svg>
