<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img">
<title>Quicksort: глубина зависит от разбиений</title><desc>Полоски показывают размеры подзадач; для схемы пренебрегаем уже выделенными опорными.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63768b"/></marker></defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif}.mono{font-family:Menlo,DejaVu Sans Mono,monospace}</style>
<rect width="1200" height="640" rx="20" fill="#f5f7fb"/>
<text x="40" y="52" font-size="30" fill="#203047" font-weight="700" text-anchor="start" class="">Quicksort: глубина зависит от разбиений</text>
<text x="40" y="88" font-size="20" fill="#203047" font-weight="400" text-anchor="start" class="">Полоски показывают размеры подзадач; для схемы пренебрегаем уже выделенными опорными.</text>
<text x="40" y="140" font-size="23" fill="#197568" font-weight="700" text-anchor="start" class="">Разбиения примерно пополам</text>
<text x="650" y="140" font-size="23" fill="#b66b13" font-weight="700" text-anchor="start" class="">Отделяется только один элемент</text>
<rect x="40.0" y="170" width="494.0" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="650" y="170" width="460" height="34" rx="10" fill="#fff0d8" stroke="#cdd7e4" stroke-width="2"/>
<text x="1130" y="195" font-size="18" fill="#203047" font-weight="400" text-anchor="end" class="">n</text>
<rect x="40.0" y="236" width="244.0" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="290.0" y="236" width="244.0" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="650" y="236" width="395" height="34" rx="10" fill="#fff0d8" stroke="#cdd7e4" stroke-width="2"/>
<text x="1130" y="261" font-size="18" fill="#203047" font-weight="400" text-anchor="end" class="">n − 1</text>
<rect x="40.0" y="302" width="119.0" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="165.0" y="302" width="119.0" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="290.0" y="302" width="119.0" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="415.0" y="302" width="119.0" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="650" y="302" width="330" height="34" rx="10" fill="#fff0d8" stroke="#cdd7e4" stroke-width="2"/>
<text x="1130" y="327" font-size="18" fill="#203047" font-weight="400" text-anchor="end" class="">n − 2</text>
<rect x="40.0" y="368" width="56.5" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="102.5" y="368" width="56.5" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="165.0" y="368" width="56.5" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="227.5" y="368" width="56.5" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="290.0" y="368" width="56.5" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="352.5" y="368" width="56.5" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="415.0" y="368" width="56.5" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="477.5" y="368" width="56.5" height="34" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="650" y="368" width="265" height="34" rx="10" fill="#fff0d8" stroke="#cdd7e4" stroke-width="2"/>
<text x="1130" y="393" font-size="18" fill="#203047" font-weight="400" text-anchor="end" class="">…</text>
<rect x="40" y="455" width="510" height="140" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="58" y="489" font-size="21" fill="#197568" font-weight="700" text-anchor="start" class="">Около log n уровней</text>
<text x="58" y="523" font-size="21" fill="#203047" font-weight="400" text-anchor="start" class="">Суммарно O(n) работы на уровень</text>
<text x="58" y="557" font-size="21" fill="#203047" font-weight="400" text-anchor="start" class="">Итого O(n log n)</text>
<rect x="650" y="455" width="510" height="140" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="668" y="489" font-size="21" fill="#b66b13" font-weight="700" text-anchor="start" class="">До n уровней</text>
<text x="668" y="523" font-size="21" fill="#203047" font-weight="400" text-anchor="start" class="">n + (n − 1) + … + 1</text>
<text x="668" y="557" font-size="21" fill="#203047" font-weight="400" text-anchor="start" class="">Итого O(n²)</text>
</svg>
