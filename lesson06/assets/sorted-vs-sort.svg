<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="585" viewBox="0 0 1200 585" role="img">
<title>sorted() и .sort(): что происходит со списком</title><desc>Два независимых продолжения: source = [5, 1, 4]; alias = source.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63768b"/></marker></defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif}.mono{font-family:Menlo,DejaVu Sans Mono,monospace}</style>
<rect width="1200" height="585" rx="20" fill="#f5f7fb"/>
<text x="40" y="52" font-size="30" fill="#203047" font-weight="700" text-anchor="start" class="">sorted() и .sort(): что происходит со списком</text>
<text x="40" y="88" font-size="20" fill="#203047" font-weight="400" text-anchor="start" class="">Два независимых продолжения: source = [5, 1, 4]; alias = source.</text>
<text x="40" y="150" font-size="25" fill="#2764b7" font-weight="400" text-anchor="start" class="mono">ordered = sorted(source)</text>
<text x="640" y="150" font-size="25" fill="#2764b7" font-weight="400" text-anchor="start" class="mono">result = source.sort()</text>
<text x="40" y="227" font-size="22" fill="#203047" font-weight="400" text-anchor="start" class="mono">source, alias</text>
<path d="M215 220L260 220" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="270" y="195" width="64" height="46" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="302.0" y="226" font-size="24" fill="#203047" font-weight="400" text-anchor="middle" class="mono">5</text>
<rect x="344" y="195" width="64" height="46" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="376.0" y="226" font-size="24" fill="#203047" font-weight="400" text-anchor="middle" class="mono">1</text>
<rect x="418" y="195" width="64" height="46" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="450.0" y="226" font-size="24" fill="#203047" font-weight="400" text-anchor="middle" class="mono">4</text>
<text x="40" y="327" font-size="22" fill="#203047" font-weight="400" text-anchor="start" class="mono">ordered</text>
<path d="M170 320L260 320" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="270" y="295" width="64" height="46" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="302.0" y="326" font-size="24" fill="#203047" font-weight="400" text-anchor="middle" class="mono">1</text>
<rect x="344" y="295" width="64" height="46" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="376.0" y="326" font-size="24" fill="#203047" font-weight="400" text-anchor="middle" class="mono">4</text>
<rect x="418" y="295" width="64" height="46" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="450.0" y="326" font-size="24" fill="#203047" font-weight="400" text-anchor="middle" class="mono">5</text>
<text x="640" y="227" font-size="22" fill="#203047" font-weight="400" text-anchor="start" class="mono">source, alias</text>
<path d="M815 220L860 220" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="870" y="195" width="64" height="46" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="902.0" y="226" font-size="24" fill="#203047" font-weight="400" text-anchor="middle" class="mono">1</text>
<rect x="944" y="195" width="64" height="46" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="976.0" y="226" font-size="24" fill="#203047" font-weight="400" text-anchor="middle" class="mono">4</text>
<rect x="1018" y="195" width="64" height="46" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="1050.0" y="226" font-size="24" fill="#203047" font-weight="400" text-anchor="middle" class="mono">5</text>
<text x="640" y="327" font-size="24" fill="#203047" font-weight="400" text-anchor="start" class="mono">result → None</text>
<rect x="40" y="405" width="520" height="140" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="58" y="439" font-size="21" fill="#2764b7" font-weight="700" text-anchor="start" class="">Новый внешний список</text>
<text x="58" y="473" font-size="21" fill="#203047" font-weight="400" text-anchor="start" class="">Исходный список не меняется.</text>
<text x="58" y="507" font-size="21" fill="#203047" font-weight="400" text-anchor="start" class="">Элементы глубоко не копируются.</text>
<rect x="640" y="405" width="520" height="140" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="658" y="439" font-size="21" fill="#2764b7" font-weight="700" text-anchor="start" class="">Тот же объект списка</text>
<text x="658" y="473" font-size="21" fill="#203047" font-weight="400" text-anchor="start" class="">Изменение видно через alias.</text>
<text x="658" y="507" font-size="21" fill="#203047" font-weight="400" text-anchor="start" class="">Метод возвращает None.</text>
</svg>
