<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc"><title id="title">Имена парсера до и после декорирования</title><desc id="desc">Сначала оба имени указывают на исходный парсер. После присваивания результата trace имя parse_quantity ведёт к обёртке, а original_parser по-прежнему ведёт к парсеру. Обёртка вызывает тот же парсер через func и печатает начало и конец вызова.</desc><rect width="1100" height="670" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" text-anchor="start" font-weight="600" fill="#243247">Куда ведут два имени парсера</text><text x="50" y="105" font-size="24" text-anchor="start" font-weight="600" fill="#243247">После original_parser = parse_quantity</text><text x="65" y="158" font-size="23" text-anchor="start" font-weight="400" fill="#243247">original_parser</text><text x="65" y="211" font-size="23" text-anchor="start" font-weight="400" fill="#243247">parse_quantity</text><rect x="745" y="125" width="305" height="105" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="765" y="162" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Исходный парсер</text><text x="765" y="197" font-size="19" text-anchor="start" font-weight="400" fill="#243247">int(text, base)</text><path d="M245 151 L740 151" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="740,151 728.0,157.0 728.0,145.0" fill="#2459a6"/><path d="M245 204 L740 204" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="740,204 728.0,210.0 728.0,198.0" fill="#2459a6"/><text x="50" y="294" font-size="24" text-anchor="start" font-weight="600" fill="#243247">После parse_quantity = trace(parse_quantity)</text><text x="65" y="350" font-size="23" text-anchor="start" font-weight="400" fill="#243247">original_parser</text><text x="65" y="422" font-size="23" text-anchor="start" font-weight="400" fill="#243247">parse_quantity</text><rect x="355" y="370" width="235" height="90" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="375" y="407" font-size="24" text-anchor="start" font-weight="600" fill="#243247">wrapper</text><text x="375" y="442" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Обёртка с журналом</text><rect x="745" y="320" width="305" height="120" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="765" y="357" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Исходный парсер</text><text x="765" y="392" font-size="19" text-anchor="start" font-weight="400" fill="#243247">int(text, base)</text><path d="M245 343 L740 343" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="740,343 728.0,349.0 728.0,337.0" fill="#2459a6"/><path d="M245 415 L350 415" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="350,415 338.0,421.0 338.0,409.0" fill="#2459a6"/><path d="M590 415 L740 415" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="740,415 728.0,421.0 728.0,409.0" fill="#2459a6"/><text x="665" y="400" font-size="20" text-anchor="middle" font-weight="400" fill="#243247">func</text><text x="50" y="530" font-size="24" text-anchor="start" font-weight="600" fill="#243247">При вызове parse_quantity(&quot;7&quot;)</text><rect x="50" y="555" width="300" height="90" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="70" y="592" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Вход в wrapper</text><text x="70" y="627" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Печатает «Начало вызова»</text><rect x="405" y="555" width="300" height="90" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="425" y="592" font-size="24" text-anchor="start" font-weight="600" fill="#243247">func(&quot;7&quot;)</text><text x="425" y="627" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Парсер возвращает 7</text><rect x="760" y="555" width="290" height="90" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="780" y="592" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Блок finally</text><text x="780" y="627" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Печатает «Конец вызова»</text><path d="M350 600 L400 600" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="400,600 388.0,606.0 388.0,594.0" fill="#2459a6"/><path d="M705 600 L755 600" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="755,600 743.0,606.0 743.0,594.0" fill="#2459a6"/></g></svg>
