<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Создание и вызов обёртки</title><desc id="desc">При декорировании trace получает исходную функцию и возвращает wrapper. При вызове wrapper выполняет общую работу, вызывает сохранённую функцию и передаёт результат или исключение дальше.</desc><rect width="1100" height="570" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" text-anchor="start" font-weight="600" fill="#243247">Создать обёртку и вызвать её — разные действия</text><text x="50" y="105" font-size="24" text-anchor="start" font-weight="600" fill="#243247">При декорировании</text><rect x="50" y="135" width="300" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="70" y="172" font-size="24" text-anchor="start" font-weight="600" fill="#243247">func</text><text x="70" y="207" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Исходная функция</text><rect x="405" y="135" width="300" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="425" y="172" font-size="24" text-anchor="start" font-weight="600" fill="#243247">trace(func)</text><text x="425" y="207" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Создаёт wrapper</text><rect x="760" y="135" width="290" height="100" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="780" y="172" font-size="24" text-anchor="start" font-weight="600" fill="#243247">wrapper</text><text x="780" y="207" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Сохраняет доступ к func</text><path d="M350 185 L400 185" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="400,185 388.0,191.0 388.0,179.0" fill="#2459a6"/><path d="M705 185 L755 185" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="755,185 743.0,191.0 743.0,179.0" fill="#2459a6"/><text x="50" y="325" font-size="24" text-anchor="start" font-weight="600" fill="#243247">При каждом вызове готовой функции</text><rect x="50" y="355" width="300" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="70" y="392" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Вход в wrapper</text><text x="70" y="427" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Общее действие до func</text><rect x="405" y="355" width="300" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="425" y="392" font-size="24" text-anchor="start" font-weight="600" fill="#243247">func(*args, **kwargs)</text><text x="425" y="427" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Исходная работа</text><rect x="760" y="355" width="290" height="100" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="780" y="392" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Выход из wrapper</text><text x="780" y="427" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Результат или исключение</text><path d="M350 405 L400 405" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="400,405 388.0,411.0 388.0,399.0" fill="#2459a6"/><path d="M705 405 L755 405" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="755,405 743.0,411.0 743.0,399.0" fill="#2459a6"/><text x="550" y="525" font-size="22" text-anchor="middle" font-weight="400" fill="#243247">Нужны return для результата и отдельное решение о завершающих действиях.</text></g></svg>
