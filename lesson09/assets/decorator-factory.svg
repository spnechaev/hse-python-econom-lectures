<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Три этапа параметризованного декоратора</title><desc id="desc">Фабрика получает настройку и возвращает декоратор. Декоратор получает функцию и возвращает обёртку. Обёртка получает аргументы каждого последующего вызова.</desc><rect width="1100" height="680" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" text-anchor="start" font-weight="600" fill="#243247">Декоратор с параметром: три разных вызова</text><rect x="50" y="110" width="450" height="105" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="70" y="147" font-size="24" text-anchor="start" font-weight="600" fill="#243247">1. announced(label)</text><text x="70" y="182" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Получает метку &quot;Импорт&quot;</text><path d="M500 162 L595 162" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="595,162 583.0,168.0 583.0,156.0" fill="#2459a6"/><rect x="600" y="110" width="450" height="105" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="620" y="147" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Возвращает decorate</text><text x="620" y="182" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Декоратор с сохранённой меткой</text><rect x="50" y="290" width="450" height="105" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="70" y="327" font-size="24" text-anchor="start" font-weight="600" fill="#243247">2. decorate(func)</text><text x="70" y="362" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Получает исходную функцию</text><path d="M500 342 L595 342" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="595,342 583.0,348.0 583.0,336.0" fill="#2459a6"/><rect x="600" y="290" width="450" height="105" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="620" y="327" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Возвращает wrapper</text><text x="620" y="362" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Доступ к label и func</text><rect x="50" y="470" width="450" height="105" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="70" y="507" font-size="24" text-anchor="start" font-weight="600" fill="#243247">3. wrapper(*args, **kwargs)</text><text x="70" y="542" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Получает данные очередного вызова</text><path d="M500 522 L595 522" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="595,522 583.0,528.0 583.0,516.0" fill="#2459a6"/><rect x="600" y="470" width="450" height="105" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="620" y="507" font-size="24" text-anchor="start" font-weight="600" fill="#243247">Вызывает func</text><text x="620" y="542" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Передаёт результат или исключение</text><text x="550" y="635" font-size="22" text-anchor="middle" font-weight="400" fill="#243247">Первые два этапа — при определении; третий — при вызове готовой функции.</text></g></svg>
