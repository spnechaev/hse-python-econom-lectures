<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="725" viewBox="0 0 1100 725" role="img" aria-labelledby="title desc"><title id="title">Поиск имён LEGB</title><desc id="desc">Для обычного чтения имени в функции проверяются текущая функция, внешние определения функций, модуль определения и встроенные имена. Найденная привязка завершает поиск. Локальное имя без значения приводит к UnboundLocalError без перехода наружу.</desc><rect width="1100" height="725" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" text-anchor="start" font-weight="600" fill="#243247">Где искать имя: от текущей функции наружу</text><rect x="60" y="100" width="650" height="90" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="80" y="137" font-size="24" text-anchor="start" font-weight="600" fill="#243247">L · Local</text><text x="80" y="172" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Текущий вызов: name, clean_name</text><path d="M380 190 L380 215" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="380,215 374.0,203.0 386.0,203.0" fill="#2459a6"/><path d="M715 145 L785 145" fill="none" stroke="#246954" stroke-width="3"/><polygon points="785,145 773.0,151.0 773.0,139.0" fill="#246954"/><text x="800" y="142" font-size="23" text-anchor="start" font-weight="400" fill="#246954">Есть привязка?</text><text x="800" y="170" font-size="20" text-anchor="start" font-weight="400" fill="#246954">Поиск закончен</text><rect x="60" y="220" width="650" height="90" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="80" y="257" font-size="24" text-anchor="start" font-weight="600" fill="#243247">E · Enclosing</text><text x="80" y="292" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Внешняя функция make_labeler: prefix</text><path d="M380 310 L380 335" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="380,335 374.0,323.0 386.0,323.0" fill="#2459a6"/><path d="M715 265 L785 265" fill="none" stroke="#246954" stroke-width="3"/><polygon points="785,265 773.0,271.0 773.0,259.0" fill="#246954"/><text x="800" y="262" font-size="23" text-anchor="start" font-weight="400" fill="#246954">Есть привязка?</text><text x="800" y="290" font-size="20" text-anchor="start" font-weight="400" fill="#246954">Поиск закончен</text><rect x="60" y="340" width="650" height="90" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="80" y="377" font-size="24" text-anchor="start" font-weight="600" fill="#243247">G · Global</text><text x="80" y="412" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Модуль определения: separator</text><path d="M380 430 L380 455" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="380,455 374.0,443.0 386.0,443.0" fill="#2459a6"/><path d="M715 385 L785 385" fill="none" stroke="#246954" stroke-width="3"/><polygon points="785,385 773.0,391.0 773.0,379.0" fill="#246954"/><text x="800" y="382" font-size="23" text-anchor="start" font-weight="400" fill="#246954">Есть привязка?</text><text x="800" y="410" font-size="20" text-anchor="start" font-weight="400" fill="#246954">Поиск закончен</text><rect x="60" y="460" width="650" height="90" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="80" y="497" font-size="24" text-anchor="start" font-weight="600" fill="#243247">B · Builtins</text><text x="80" y="532" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Встроенные имена: len, int, print</text><path d="M715 505 L785 505" fill="none" stroke="#246954" stroke-width="3"/><polygon points="785,505 773.0,511.0 773.0,499.0" fill="#246954"/><text x="800" y="502" font-size="23" text-anchor="start" font-weight="400" fill="#246954">Есть привязка?</text><text x="800" y="530" font-size="20" text-anchor="start" font-weight="400" fill="#246954">Поиск закончен</text><text x="60" y="610" font-size="22" text-anchor="start" font-weight="400" fill="#243247">Следующий уровень нужен, если на предыдущем нет подходящей привязки.</text><text x="60" y="648" font-size="22" text-anchor="start" font-weight="400" fill="#243247">Локальные имена вызывающей функции не добавляются в эту цепочку.</text><text x="60" y="686" font-size="21" text-anchor="start" font-weight="400" fill="#243247">Локальное имя без значения даёт UnboundLocalError, а не поиск снаружи.</text></g></svg>
