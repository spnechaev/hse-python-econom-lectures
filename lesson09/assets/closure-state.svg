<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">Независимое состояние замыканий</title><desc id="desc">Два вызова фабрики создают отдельные переменные current и возвращают отдельные функции next_value. nonlocal каждой функции меняет только свою внешнюю переменную.</desc><rect width="1100" height="610" rx="18" fill="#fcfcfa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="30" text-anchor="start" font-weight="600" fill="#243247">Каждый вызов фабрики создаёт своё состояние</text><rect x="50" y="110" width="470" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="70" y="147" font-size="24" text-anchor="start" font-weight="600" fill="#243247">make_counter()</text><text x="70" y="182" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Первый вызов фабрики</text><rect x="580" y="110" width="470" height="100" rx="14" fill="#eef3fb" stroke="#2459a6" stroke-width="2"/><text x="600" y="147" font-size="24" text-anchor="start" font-weight="600" fill="#243247">make_counter(100)</text><text x="600" y="182" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Второй вызов фабрики</text><path d="M285 210 L285 285" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="285,285 279.0,273.0 291.0,273.0" fill="#2459a6"/><path d="M815 210 L815 285" fill="none" stroke="#2459a6" stroke-width="3"/><polygon points="815,285 809.0,273.0 821.0,273.0" fill="#2459a6"/><rect x="50" y="290" width="470" height="110" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="70" y="327" font-size="24" text-anchor="start" font-weight="600" fill="#243247">first_counter → next_value</text><text x="70" y="362" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Своё current: 0 → 1 → 2 → 3</text><rect x="580" y="290" width="470" height="110" rx="14" fill="#edf7f1" stroke="#246954" stroke-width="2"/><text x="600" y="327" font-size="24" text-anchor="start" font-weight="600" fill="#243247">second_counter → next_value</text><text x="600" y="362" font-size="19" text-anchor="start" font-weight="400" fill="#243247">Своё current: 100 → 101</text><text x="285" y="460" font-size="26" text-anchor="middle" font-weight="600" fill="#243247">nonlocal current</text><text x="815" y="460" font-size="26" text-anchor="middle" font-weight="600" fill="#243247">nonlocal current</text><text x="285" y="500" font-size="22" text-anchor="middle" font-weight="400" fill="#243247">указывает на левую привязку</text><text x="815" y="500" font-size="22" text-anchor="middle" font-weight="400" fill="#243247">указывает на правую привязку</text><text x="550" y="570" font-size="23" text-anchor="middle" font-weight="400" fill="#243247">Внешний вызов закончился, доступ к нужной привязке сохранился.</text></g></svg>
