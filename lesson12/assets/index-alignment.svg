<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="545" viewBox="0 0 1120 545" role="img" aria-labelledby="title desc"><title id="title">Выравнивание Series и позиционные массивы</title><desc id="desc">Series сопоставляет метки А и Б. После удаления индексов NumPy складывает числа на одинаковых позициях, что даёт другой результат.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1120" height="545" rx="18" fill="#fcfbf7"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="47" font-size="29" fill="#243247" font-weight="600" text-anchor="start">Метки и позиции — два разных правила</text><rect x="35" y="90" width="285" height="130" rx="12" fill="#edf3f7" stroke="#32667d" stroke-width="2"/><text x="53" y="123" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">left</text><text x="53" y="152" font-size="19" fill="#243247" font-weight="400" text-anchor="start">А →100</text><text x="53" y="181" font-size="19" fill="#243247" font-weight="400" text-anchor="start">Б →200</text><rect x="415" y="90" width="285" height="130" rx="12" fill="#edf3f7" stroke="#32667d" stroke-width="2"/><text x="433" y="123" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">right</text><text x="433" y="152" font-size="19" fill="#243247" font-weight="400" text-anchor="start">Б →10</text><text x="433" y="181" font-size="19" fill="#243247" font-weight="400" text-anchor="start">А →20</text><rect x="795" y="90" width="290" height="130" rx="12" fill="#edf5ed" stroke="#2c6b52" stroke-width="2"/><text x="813" y="123" font-size="23" fill="#2c6b52" font-weight="600" text-anchor="start">pandas: по меткам</text><text x="813" y="152" font-size="19" fill="#243247" font-weight="400" text-anchor="start">А →100 +20 =120</text><text x="813" y="181" font-size="19" fill="#243247" font-weight="400" text-anchor="start">Б →200 +10 =210</text><text x="365" y="166" font-size="34" fill="#243247" font-weight="400" text-anchor="middle">+</text><path d="M705 155 L785 155" fill="none" stroke="#32667d" stroke-width="3"/><polygon points="785,155 773.0,161.0 773.0,149.0" fill="#32667d"/><text x="35" y="290" font-size="24" fill="#a34d38" font-weight="600" text-anchor="start">После to_numpy() у чисел больше нет подписей строк</text><rect x="35" y="330" width="285" height="110" rx="12" fill="#edf3f7" stroke="#32667d" stroke-width="2"/><text x="53" y="363" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">[100,200]</text><text x="53" y="392" font-size="19" fill="#243247" font-weight="400" text-anchor="start">Тот же порядок left</text><rect x="415" y="330" width="285" height="110" rx="12" fill="#edf3f7" stroke="#32667d" stroke-width="2"/><text x="433" y="363" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">[10,20]</text><text x="433" y="392" font-size="19" fill="#243247" font-weight="400" text-anchor="start">Тот же порядок right</text><rect x="795" y="330" width="290" height="110" rx="12" fill="#faefea" stroke="#a34d38" stroke-width="2"/><text x="813" y="363" font-size="23" fill="#a34d38" font-weight="600" text-anchor="start">NumPy: по позициям</text><text x="813" y="392" font-size="19" fill="#243247" font-weight="400" text-anchor="start">[110,220]</text><text x="365" y="396" font-size="34" fill="#243247" font-weight="400" text-anchor="middle">+</text><path d="M705 385 L785 385" fill="none" stroke="#a34d38" stroke-width="3"/><polygon points="785,385 773.0,391.0 773.0,379.0" fill="#a34d38"/><text x="35" y="502" font-size="22" fill="#243247" font-weight="400" text-anchor="start">Одинаковая длина не доказывает соответствие клиентов, товаров или дат.</text></g></svg>
