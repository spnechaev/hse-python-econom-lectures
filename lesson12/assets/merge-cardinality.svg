<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="575" viewBox="0 0 1120 575" role="img" aria-labelledby="title desc"><title id="title">Число совпадений при merge</title><desc id="desc">Две продажи и одна строка товара дают две строки. Две строки того же товара справа дали бы четыре; validate many_to_one отклоняет такой справочник.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1120" height="575" rx="18" fill="#fcfbf7"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="47" font-size="29" fill="#243247" font-weight="600" text-anchor="start">Соединение может размножить строки — и деньги</text><text x="35" y="97" font-size="23" fill="#2c6b52" font-weight="600" text-anchor="start">Справа ключ уникален</text><rect x="35" y="120" width="265" height="110" rx="12" fill="#edf3f7" stroke="#32667d" stroke-width="2"/><text x="53" y="153" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">Две продажи</text><text x="53" y="182" font-size="19" fill="#243247" font-weight="400" text-anchor="start">A → товар 001</text><text x="53" y="211" font-size="19" fill="#243247" font-weight="400" text-anchor="start">B → товар 001</text><path d="M305 175 L355 175" fill="none" stroke="#32667d" stroke-width="3"/><polygon points="355,175 343.0,181.0 343.0,169.0" fill="#32667d"/><rect x="365" y="120" width="305" height="110" rx="12" fill="#edf3f7" stroke="#32667d" stroke-width="2"/><text x="383" y="153" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">Одна строка товара</text><text x="383" y="182" font-size="19" fill="#243247" font-weight="400" text-anchor="start">001 → стоимость 1500</text><path d="M675 175 L725 175" fill="none" stroke="#32667d" stroke-width="3"/><polygon points="725,175 713.0,181.0 713.0,169.0" fill="#32667d"/><rect x="735" y="120" width="350" height="110" rx="12" fill="#edf5ed" stroke="#2c6b52" stroke-width="2"/><text x="753" y="153" font-size="23" fill="#2c6b52" font-weight="600" text-anchor="start">Две строки результата</text><text x="753" y="182" font-size="19" fill="#243247" font-weight="400" text-anchor="start">Каждая нашла одну цену</text><text x="35" y="301" font-size="23" fill="#a34d38" font-weight="600" text-anchor="start">Справа один ключ встречается дважды</text><rect x="35" y="325" width="265" height="110" rx="12" fill="#edf3f7" stroke="#32667d" stroke-width="2"/><text x="53" y="358" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">Две продажи</text><text x="53" y="387" font-size="19" fill="#243247" font-weight="400" text-anchor="start">A → товар 001</text><text x="53" y="416" font-size="19" fill="#243247" font-weight="400" text-anchor="start">B → товар 001</text><path d="M305 380 L355 380" fill="none" stroke="#32667d" stroke-width="3"/><polygon points="355,380 343.0,386.0 343.0,374.0" fill="#32667d"/><rect x="365" y="325" width="305" height="110" rx="12" fill="#faefea" stroke="#a34d38" stroke-width="2"/><text x="383" y="358" font-size="23" fill="#a34d38" font-weight="600" text-anchor="start">Две строки товара</text><text x="383" y="387" font-size="19" fill="#243247" font-weight="400" text-anchor="start">001 → стоимость 1500</text><text x="383" y="416" font-size="19" fill="#243247" font-weight="400" text-anchor="start">001 → стоимость 1500</text><path d="M675 380 L725 380" fill="none" stroke="#a34d38" stroke-width="3"/><polygon points="725,380 713.0,386.0 713.0,374.0" fill="#a34d38"/><rect x="735" y="325" width="350" height="110" rx="12" fill="#faefea" stroke="#a34d38" stroke-width="2"/><text x="753" y="358" font-size="23" fill="#a34d38" font-weight="600" text-anchor="start">Без проверки: 4 строки</text><text x="753" y="387" font-size="19" fill="#243247" font-weight="400" text-anchor="start">Каждая продажа удвоилась</text><text x="35" y="492" font-size="24" fill="#2c6b52" font-weight="400" text-anchor="start">validate=&quot;many_to_one&quot; останавливает второй случай до расчёта.</text><text x="35" y="535" font-size="20" fill="#a34d38" font-weight="400" text-anchor="start">Но даже уникальный месячный расход нельзя суммировать у товарных строк.</text></g></svg>
