<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc"><title id="title">Сетка скидок и объёмов</title><desc id="desc">Столбец трёх скидок и строка трёх объёмов дают девять сочетаний. Цвет показывает, сохраняется ли исходная маржа 8000рублей до рекламы и прочих расходов.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1120" height="690" rx="18" fill="#fcfbf7"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="47" font-size="28" fill="#243247" font-weight="600" text-anchor="start">Broadcasting: скидки по строкам, объёмы по столбцам</text><rect x="35" y="95" width="285" height="155" rx="12" fill="#edf3f7" stroke="#32667d" stroke-width="2"/><text x="53" y="128" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">Скидки (3, 1)</text><text x="53" y="157" font-size="19" fill="#243247" font-weight="400" text-anchor="start">0%</text><text x="53" y="186" font-size="19" fill="#243247" font-weight="400" text-anchor="start">5%</text><text x="53" y="215" font-size="19" fill="#243247" font-weight="400" text-anchor="start">10%</text><rect x="370" y="95" width="715" height="100" rx="12" fill="#edf3f7" stroke="#32667d" stroke-width="2"/><text x="388" y="128" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">Объёмы (1, 3)</text><text x="388" y="157" font-size="19" fill="#243247" font-weight="400" text-anchor="start">100, 110, 130 штук</text><text x="35" y="282" font-size="24" fill="#2c6b52" font-weight="600" text-anchor="start">Результат (3, 3)</text><text x="375" y="282" font-size="22" fill="#243247" font-weight="400" text-anchor="middle">100 шт.</text><text x="655" y="282" font-size="22" fill="#243247" font-weight="400" text-anchor="middle">110 шт.</text><text x="935" y="282" font-size="22" fill="#243247" font-weight="400" text-anchor="middle">130 шт.</text><text x="75" y="341" font-size="24" fill="#243247" font-weight="600" text-anchor="start">0%</text><rect x="250" y="300" width="250" height="65" rx="12" fill="#edf5ed" stroke="#2c6b52" stroke-width="2"/><text x="268" y="333" font-size="23" fill="#2c6b52" font-weight="600" text-anchor="start">8 000 руб.</text><rect x="530" y="300" width="250" height="65" rx="12" fill="#edf5ed" stroke="#2c6b52" stroke-width="2"/><text x="548" y="333" font-size="23" fill="#2c6b52" font-weight="600" text-anchor="start">8 800 руб.</text><rect x="810" y="300" width="250" height="65" rx="12" fill="#edf5ed" stroke="#2c6b52" stroke-width="2"/><text x="828" y="333" font-size="23" fill="#2c6b52" font-weight="600" text-anchor="start">10 400 руб.</text><text x="75" y="426" font-size="24" fill="#243247" font-weight="600" text-anchor="start">5%</text><rect x="250" y="385" width="250" height="65" rx="12" fill="#f8eee8" stroke="#a34d38" stroke-width="2"/><text x="268" y="418" font-size="23" fill="#a34d38" font-weight="600" text-anchor="start">6 000 руб.</text><rect x="530" y="385" width="250" height="65" rx="12" fill="#f8eee8" stroke="#a34d38" stroke-width="2"/><text x="548" y="418" font-size="23" fill="#a34d38" font-weight="600" text-anchor="start">6 600 руб.</text><rect x="810" y="385" width="250" height="65" rx="12" fill="#f8eee8" stroke="#a34d38" stroke-width="2"/><text x="828" y="418" font-size="23" fill="#a34d38" font-weight="600" text-anchor="start">7 800 руб.</text><text x="75" y="511" font-size="24" fill="#243247" font-weight="600" text-anchor="start">10%</text><rect x="250" y="470" width="250" height="65" rx="12" fill="#f8eee8" stroke="#a34d38" stroke-width="2"/><text x="268" y="503" font-size="23" fill="#a34d38" font-weight="600" text-anchor="start">4 000 руб.</text><rect x="530" y="470" width="250" height="65" rx="12" fill="#f8eee8" stroke="#a34d38" stroke-width="2"/><text x="548" y="503" font-size="23" fill="#a34d38" font-weight="600" text-anchor="start">4 400 руб.</text><rect x="810" y="470" width="250" height="65" rx="12" fill="#f8eee8" stroke="#a34d38" stroke-width="2"/><text x="828" y="503" font-size="23" fill="#a34d38" font-weight="600" text-anchor="start">5 200 руб.</text><text x="35" y="604" font-size="22" fill="#243247" font-weight="400" text-anchor="start">В каждой клетке: количество × (цена после скидки − стоимость товара).</text><text x="35" y="647" font-size="21" fill="#a34d38" font-weight="400" text-anchor="start">Это заданные сценарии, а не прогноз спроса. Другие расходы здесь не вычтены.</text></g></svg>
