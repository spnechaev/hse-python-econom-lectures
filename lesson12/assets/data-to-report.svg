<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="695" viewBox="0 0 1120 695" role="img" aria-labelledby="title desc"><title id="title">Уровни данных и порядок расчёта</title><desc id="desc">События соединяются с товарами после проверок. Реклама присоединяется только к своду по месяцу и каналу; группа без продаж сохраняется.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1120" height="695" rx="18" fill="#fcfbf7"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="47" font-size="29" fill="#243247" font-weight="600" text-anchor="start">Сначала строки событий, затем месячные расходы</text><rect x="35" y="85" width="310" height="100" rx="12" fill="#edf3f7" stroke="#32667d" stroke-width="2"/><text x="53" y="118" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">transactions.csv</text><text x="53" y="147" font-size="19" fill="#243247" font-weight="400" text-anchor="start">117 исходных событий</text><rect x="405" y="85" width="310" height="100" rx="12" fill="#edf3f7" stroke="#32667d" stroke-width="2"/><text x="423" y="118" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">products.csv</text><text x="423" y="147" font-size="19" fill="#243247" font-weight="400" text-anchor="start">4 уникальных товара</text><rect x="775" y="85" width="310" height="100" rx="12" fill="#edf3f7" stroke="#32667d" stroke-width="2"/><text x="793" y="118" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">advertising.csv</text><text x="793" y="147" font-size="19" fill="#243247" font-weight="400" text-anchor="start">6 пар «месяц + канал»</text><path d="M190 185 L220 290" fill="none" stroke="#32667d" stroke-width="3"/><polygon points="220,290 210.93420277938654,280.1100393956944 222.4724901510764,276.81338586092585" fill="#32667d"/><path d="M560 185 L530 290" fill="none" stroke="#32667d" stroke-width="3"/><polygon points="530,290 527.5275098489236,276.81338586092585 539.0657972206135,280.1100393956944" fill="#32667d"/><rect x="35" y="300" width="680" height="110" rx="12" fill="#edf5ed" stroke="#2c6b52" stroke-width="2"/><text x="53" y="333" font-size="23" fill="#2c6b52" font-weight="600" text-anchor="start">Проверить и посчитать товарные строки</text><text x="53" y="362" font-size="19" fill="#243247" font-weight="400" text-anchor="start">3 повтора, 8 отказов и 6 отмен — отдельно</text><text x="53" y="391" font-size="19" fill="#243247" font-weight="400" text-anchor="start">100 принятых событий для расчёта</text><path d="M245 410 L245 490" fill="none" stroke="#32667d" stroke-width="3"/><polygon points="245,490 239.0,478.0 251.0,478.0" fill="#32667d"/><rect x="35" y="500" width="400" height="100" rx="12" fill="#edf3f7" stroke="#32667d" stroke-width="2"/><text x="53" y="533" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">Свод продаж</text><text x="53" y="562" font-size="19" fill="#243247" font-weight="400" text-anchor="start">5 пар «месяц + канал»</text><path d="M435 550 L495 550" fill="none" stroke="#32667d" stroke-width="3"/><polygon points="495,550 483.0,556.0 483.0,544.0" fill="#32667d"/><rect x="505" y="500" width="580" height="100" rx="12" fill="#edf5ed" stroke="#2c6b52" stroke-width="2"/><text x="523" y="533" font-size="23" fill="#2c6b52" font-weight="600" text-anchor="start">Свод + реклама → 6 групп</text><text x="523" y="562" font-size="19" fill="#243247" font-weight="400" text-anchor="start">Расход без продаж тоже остаётся</text><text x="523" y="591" font-size="19" fill="#243247" font-weight="400" text-anchor="start">По нему и собираем два месячных итога</text><path d="M930 185 L930 490" fill="none" stroke="#32667d" stroke-width="3"/><polygon points="930,490 924.0,478.0 936.0,478.0" fill="#32667d"/><text x="35" y="657" font-size="22" fill="#a34d38" font-weight="400" text-anchor="start">Сумму месячного бюджета нельзя повторять у каждой проданной вещи.</text></g></svg>
