<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">Средняя цена строки и средняя цена единицы</title><desc id="desc">Среднее двух строк равно800рублям, но средняя цена одной из шести проданных единиц равна533,33рубля. Веса определяются смыслом показателя.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1120" height="570" rx="18" fill="#fcfbf7"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="47" font-size="29" fill="#243247" font-weight="600" text-anchor="start">Что именно должно иметь одинаковый вес?</text><rect x="35" y="90" width="500" height="100" rx="12" fill="#edf3f7" stroke="#32667d" stroke-width="2"/><text x="53" y="123" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">Одна строка: 1 лампа по 1200 руб.</text><text x="53" y="152" font-size="19" fill="#243247" font-weight="400" text-anchor="start">Другая строка: 5 кабелей по 400 руб.</text><rect x="585" y="90" width="500" height="100" rx="12" fill="#f8f2e3" stroke="#93691d" stroke-width="2"/><text x="603" y="123" font-size="23" fill="#93691d" font-weight="600" text-anchor="start">Среднее по двум строкам</text><text x="603" y="152" font-size="19" fill="#243247" font-weight="400" text-anchor="start">(1200 + 400) / 2 = 800 руб.</text><text x="35" y="248" font-size="25" fill="#2c6b52" font-weight="600" text-anchor="start">Цена одной проданной единицы</text><rect x="35" y="280" width="150" height="95" rx="12" fill="#f4e8d4" stroke="#93691d" stroke-width="2"/><text x="53" y="313" font-size="23" fill="#93691d" font-weight="600" text-anchor="start">Лампа</text><text x="53" y="342" font-size="19" fill="#243247" font-weight="400" text-anchor="start">1200 руб.</text><rect x="210" y="280" width="150" height="95" rx="12" fill="#e4eef4" stroke="#32667d" stroke-width="2"/><text x="228" y="313" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">Кабель</text><text x="228" y="342" font-size="19" fill="#243247" font-weight="400" text-anchor="start">400 руб.</text><rect x="385" y="280" width="150" height="95" rx="12" fill="#e4eef4" stroke="#32667d" stroke-width="2"/><text x="403" y="313" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">Кабель</text><text x="403" y="342" font-size="19" fill="#243247" font-weight="400" text-anchor="start">400 руб.</text><rect x="560" y="280" width="150" height="95" rx="12" fill="#e4eef4" stroke="#32667d" stroke-width="2"/><text x="578" y="313" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">Кабель</text><text x="578" y="342" font-size="19" fill="#243247" font-weight="400" text-anchor="start">400 руб.</text><rect x="735" y="280" width="150" height="95" rx="12" fill="#e4eef4" stroke="#32667d" stroke-width="2"/><text x="753" y="313" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">Кабель</text><text x="753" y="342" font-size="19" fill="#243247" font-weight="400" text-anchor="start">400 руб.</text><rect x="910" y="280" width="150" height="95" rx="12" fill="#e4eef4" stroke="#32667d" stroke-width="2"/><text x="928" y="313" font-size="23" fill="#32667d" font-weight="600" text-anchor="start">Кабель</text><text x="928" y="342" font-size="19" fill="#243247" font-weight="400" text-anchor="start">400 руб.</text><text x="35" y="435" font-size="28" fill="#2c6b52" font-weight="600" text-anchor="start">(1 × 1200 + 5 × 400) / (1 + 5) = 533,33… руб.</text><text x="35" y="488" font-size="22" fill="#243247" font-weight="400" text-anchor="start">Теперь каждая из шести проданных вещей имеет одинаковый вес.</text><text x="35" y="531" font-size="20" fill="#a34d38" font-weight="400" text-anchor="start">При изменении состава продаж эта средняя меняется даже без изменения цен.</text></g></svg>
