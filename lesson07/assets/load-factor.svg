<text x="40" y="497" font-size="22" fill="#203047" font-weight="400" text-anchor="start" class="">Четыре пары в каждой цепочке.</text>
<text x="660" y="593" font-size="22" fill="#197568" font-weight="400" text-anchor="start" class="">Поиск 6: одна пара в корзине 6.</text>
