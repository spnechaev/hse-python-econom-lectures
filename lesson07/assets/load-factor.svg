<text x="40" y="52" font-size="30" fill="#203047" font-weight="700" text-anchor="start" class="">Те же восемь ключей — разная длина цепочек</text>
<text x="40" y="88" font-size="20" fill="#203047" font-weight="400" text-anchor="start" class="">Коэффициент заполнения α = число пар / число корзин. Здесь показаны только ключи.</text>
<text x="40" y="143" font-size="24" fill="#b66b13" font-weight="700" text-anchor="start" class="">2 корзины: α = 8 / 2 = 4</text>
<text x="660" y="143" font-size="24" fill="#197568" font-weight="700" text-anchor="start" class="">8 корзин: α = 8 / 8 = 1</text>
