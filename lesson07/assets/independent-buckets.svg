<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img">
<title>Корзины должны быть разными списками</title><desc>Копирование ссылки на один список не создаёт независимые корзины.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63768b"/></marker></defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif}.mono{font-family:Menlo,DejaVu Sans Mono,monospace}</style>
<rect width="1200" height="600" rx="20" fill="#f5f7fb"/>
<text x="40" y="52" font-size="30" fill="#203047" font-weight="700" text-anchor="start" class="">Корзины должны быть разными списками</text>
<text x="40" y="88" font-size="20" fill="#203047" font-weight="400" text-anchor="start" class="">Копирование ссылки на один список не создаёт независимые корзины.</text>
<text x="40" y="145" font-size="25" fill="#b66b13" font-weight="400" text-anchor="start" class="mono">[[]] * 3</text>
<text x="660" y="145" font-size="24" fill="#197568" font-weight="400" text-anchor="start" class="mono">[[] for _ in range(3)]</text>
<text x="40" y="183" font-size="22" fill="#b66b13" font-weight="400" text-anchor="start" class="">Три ссылки на один объект</text>
<text x="660" y="183" font-size="22" fill="#197568" font-weight="400" text-anchor="start" class="">Три отдельных объекта</text>
<rect x="45" y="225" width="110" height="55" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="100" y="261" font-size="25" fill="#203047" font-weight="400" text-anchor="middle" class="mono">[0]</text>
<rect x="665" y="225" width="110" height="55" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="720" y="261" font-size="25" fill="#203047" font-weight="400" text-anchor="middle" class="mono">[0]</text>
<path d="M165 252L325 342" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M785 252L895 252" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="905" y="225" width="245" height="55" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="925" y="261" font-size="24" fill="#203047" font-weight="400" text-anchor="start" class="mono">[[&quot;test&quot;, 1]]</text>
<rect x="45" y="315" width="110" height="55" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="100" y="351" font-size="25" fill="#203047" font-weight="400" text-anchor="middle" class="mono">[1]</text>
<rect x="665" y="315" width="110" height="55" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="720" y="351" font-size="25" fill="#203047" font-weight="400" text-anchor="middle" class="mono">[1]</text>
<path d="M165 342L325 342" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M785 342L895 342" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="905" y="315" width="245" height="55" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="925" y="351" font-size="24" fill="#203047" font-weight="400" text-anchor="start" class="mono">[]</text>
<rect x="45" y="405" width="110" height="55" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="100" y="441" font-size="25" fill="#203047" font-weight="400" text-anchor="middle" class="mono">[2]</text>
<rect x="665" y="405" width="110" height="55" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="720" y="441" font-size="25" fill="#203047" font-weight="400" text-anchor="middle" class="mono">[2]</text>
<path d="M165 432L325 342" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M785 432L895 432" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="905" y="405" width="245" height="55" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="925" y="441" font-size="24" fill="#203047" font-weight="400" text-anchor="start" class="mono">[]</text>
<rect x="335" y="315" width="245" height="55" rx="10" fill="#fff0d8" stroke="#cdd7e4" stroke-width="2"/>
<text x="355" y="351" font-size="24" fill="#203047" font-weight="400" text-anchor="start" class="mono">[[&quot;test&quot;, 1]]</text>
<text x="40" y="512" font-size="22" fill="#203047" font-weight="400" text-anchor="start" class="mono">После table[0].append([&quot;test&quot;, 1]):</text>
<text x="40" y="552" font-size="22" fill="#b66b13" font-weight="400" text-anchor="start" class="">Запись видна через все три ссылки.</text>
<text x="660" y="552" font-size="22" fill="#197568" font-weight="400" text-anchor="start" class="">Изменилась только корзина 0.</text>
</svg>
