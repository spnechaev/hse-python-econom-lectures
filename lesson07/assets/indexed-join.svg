<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img">
<title>Соединяем таблицы по ключу</title><desc>Ключи балансов уникальны. В этом примере баланс есть для каждого профиля.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63768b"/></marker></defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif}.mono{font-family:Menlo,DejaVu Sans Mono,monospace}</style>
<rect width="1200" height="810" rx="20" fill="#f5f7fb"/>
<text x="40" y="52" font-size="30" fill="#203047" font-weight="700" text-anchor="start" class="">Соединяем таблицы по ключу</text>
<text x="40" y="88" font-size="20" fill="#203047" font-weight="400" text-anchor="start" class="">Ключи балансов уникальны. В этом примере баланс есть для каждого профиля.</text>
<text x="40" y="145" font-size="24" fill="#2764b7" font-weight="700" text-anchor="start" class="">1. Один проход по балансам → строим индекс</text>
<rect x="40" y="170" width="350" height="150" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="60" y="204" font-size="22" fill="#2764b7" font-weight="700" text-anchor="start" class="">Балансы</text>
<text x="60" y="247" font-size="24" fill="#203047" font-weight="400" text-anchor="start" class="mono">c-2     300</text>
<text x="60" y="290" font-size="24" fill="#203047" font-weight="400" text-anchor="start" class="mono">c-1     120</text>
<path d="M410 245L570 245" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="590" y="170" width="570" height="150" rx="10" fill="#dce8fa" stroke="#cdd7e4" stroke-width="2"/>
<text x="610" y="204" font-size="22" fill="#2764b7" font-weight="700" text-anchor="start" class="mono">balance_by_client: dict</text>
<text x="610" y="247" font-size="24" fill="#203047" font-weight="400" text-anchor="start" class="">c-2  →  300</text>
<text x="610" y="290" font-size="24" fill="#203047" font-weight="400" text-anchor="start" class="">c-1  →  120</text>
<text x="40" y="375" font-size="24" fill="#2764b7" font-weight="700" text-anchor="start" class="">2. Идём по профилям → берём баланс из индекса</text>
<text x="60" y="425" font-size="22" fill="#2764b7" font-weight="700" text-anchor="start" class="">Профили</text>
<text x="430" y="425" font-size="22" fill="#2764b7" font-weight="700" text-anchor="start" class="">Поиск по ключу</text>
<text x="850" y="425" font-size="22" fill="#197568" font-weight="700" text-anchor="start" class="">Результат</text>
<rect x="40" y="450" width="290" height="62" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="60" y="489" font-size="24" fill="#203047" font-weight="400" text-anchor="start" class="mono">c-1   Анна</text>
<path d="M345 481L410 481" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="425" y="450" width="335" height="62" rx="10" fill="#dce8fa" stroke="#cdd7e4" stroke-width="2"/>
<text x="445" y="489" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="mono">индекс[&#x27;c-1&#x27;]</text>
<path d="M775 481L830 481" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="845" y="450" width="315" height="62" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="865" y="489" font-size="24" fill="#197568" font-weight="400" text-anchor="start" class="">Анна · 120</text>
<rect x="40" y="535" width="290" height="62" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="60" y="574" font-size="24" fill="#203047" font-weight="400" text-anchor="start" class="mono">c-2   Борис</text>
<path d="M345 566L410 566" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="425" y="535" width="335" height="62" rx="10" fill="#dce8fa" stroke="#cdd7e4" stroke-width="2"/>
<text x="445" y="574" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="mono">индекс[&#x27;c-2&#x27;]</text>
<path d="M775 566L830 566" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="845" y="535" width="315" height="62" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="865" y="574" font-size="24" fill="#197568" font-weight="400" text-anchor="start" class="">Борис · 300</text>
<rect x="40" y="640" width="1120" height="125" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="60" y="678" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="">Было: до n × m сравнений во вложенных циклах.</text>
<text x="60" y="715" font-size="23" fill="#197568" font-weight="700" text-anchor="start" class="">Стало: O(n + m) в среднем; индекс занимает O(m) памяти.</text>
<text x="60" y="750" font-size="21" fill="#203047" font-weight="400" text-anchor="start" class="">n — число профилей, m — число балансов. Порядок результата — как у профилей.</text>
</svg>
