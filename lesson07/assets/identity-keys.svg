<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
<title>Ключ узнаём по объекту или по равенству</title><desc>NaN не равен самому себе. Ниже показаны результаты отдельных сравнений is и ==.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63768b"/></marker></defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif}.mono{font-family:Menlo,DejaVu Sans Mono,monospace}</style>
<rect width="1200" height="800" rx="20" fill="#f5f7fb"/>
<text x="40" y="52" font-size="30" fill="#203047" font-weight="700" text-anchor="start" class="">Ключ узнаём по объекту или по равенству</text>
<text x="40" y="88" font-size="20" fill="#203047" font-weight="400" text-anchor="start" class="">NaN не равен самому себе. Ниже показаны результаты отдельных сравнений is и ==.</text>
<rect x="40" y="120" width="1120" height="65" rx="10" fill="#dce8fa" stroke="#cdd7e4" stroke-width="2"/>
<text x="600" y="162" font-size="27" fill="#2764b7" font-weight="400" text-anchor="middle" class="mono">stored_key is key or stored_key == key</text>
<rect x="40" y="210" width="535" height="305" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<rect x="625" y="210" width="535" height="305" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="60" y="249" font-size="24" fill="#2764b7" font-weight="700" text-anchor="start" class="">Повторно передали nan_key</text>
<text x="645" y="249" font-size="22" fill="#b66b13" font-weight="700" text-anchor="start" class="">Создали other_nan = float(&quot;nan&quot;)</text>
<text x="60" y="295" font-size="21" fill="#203047" font-weight="400" text-anchor="start" class="mono">stored_key</text>
<text x="340" y="295" font-size="21" fill="#203047" font-weight="400" text-anchor="start" class="mono">key</text>
<path d="M175 310L260 355" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M355 310L300 355" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="210" y="365" width="180" height="50" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="300" y="398" font-size="21" fill="#197568" font-weight="400" text-anchor="middle" class="">Объект A: NaN</text>
<text x="60" y="455" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="mono">is → True;  == → False</text>
<text x="60" y="490" font-size="22" fill="#197568" font-weight="400" text-anchor="start" class="">Один объект: обновляем значение.</text>
<rect x="645" y="300" width="215" height="60" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<rect x="905" y="300" width="235" height="60" rx="10" fill="#fff0d8" stroke="#cdd7e4" stroke-width="2"/>
<text x="752" y="338" font-size="21" fill="#197568" font-weight="400" text-anchor="middle" class="">Объект A: NaN</text>
<text x="1022" y="338" font-size="21" fill="#b66b13" font-weight="400" text-anchor="middle" class="">Объект B: NaN</text>
<text x="752" y="397" font-size="21" fill="#203047" font-weight="400" text-anchor="middle" class="mono">stored_key</text>
<text x="1022" y="397" font-size="21" fill="#203047" font-weight="400" text-anchor="middle" class="mono">key</text>
<text x="645" y="455" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="mono">is → False;  == → False</text>
<text x="645" y="490" font-size="22" fill="#b66b13" font-weight="400" text-anchor="start" class="">Другой объект: добавляем пару.</text>
<text x="40" y="560" font-size="23" fill="#2764b7" font-weight="700" text-anchor="start" class="">После обновления A и вставки B в корзине две пары:</text>
<rect x="40" y="585" width="535" height="65" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="60" y="626" font-size="24" fill="#203047" font-weight="400" text-anchor="start" class="mono">[объект A, &quot;updated&quot;]</text>
<rect x="625" y="585" width="535" height="65" rx="10" fill="#fff0d8" stroke="#cdd7e4" stroke-width="2"/>
<text x="645" y="626" font-size="24" fill="#203047" font-weight="400" text-anchor="start" class="mono">[объект B, &quot;second&quot;]</text>
<text x="40" y="706" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="">При True у is правая часть or уже не вычисляется.</text>
<text x="40" y="751" font-size="22" fill="#203047" font-weight="400" text-anchor="start" class="">Одну и ту же проверку используем при вставке, поиске и удалении.</text>
</svg>
