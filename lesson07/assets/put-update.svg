<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img">
<title>Вставка: новая пара или новое значение?</title><desc>Два последовательных вызова на одной таблице. Здесь len(table) = 2.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63768b"/></marker></defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif}.mono{font-family:Menlo,DejaVu Sans Mono,monospace}</style>
<rect width="1200" height="740" rx="20" fill="#f5f7fb"/>
<text x="40" y="52" font-size="30" fill="#203047" font-weight="700" text-anchor="start" class="">Вставка: новая пара или новое значение?</text>
<text x="40" y="88" font-size="20" fill="#203047" font-weight="400" text-anchor="start" class="">Два последовательных вызова на одной таблице. Здесь len(table) = 2.</text>
<text x="40" y="140" font-size="23" fill="#2764b7" font-weight="700" text-anchor="start" class="">До вызовов</text>
<rect x="40" y="160" width="1120" height="90" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="60" y="215" font-size="22" fill="#2764b7" font-weight="400" text-anchor="start" class="mono">table[1]</text>
<rect x="240" y="178" width="270" height="54" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="258" y="214" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="mono">[1, &quot;one&quot;]</text>
<rect x="540" y="178" width="270" height="54" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="558" y="214" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="mono">[3, &quot;three&quot;]</text>
<text x="40" y="315" font-size="23" fill="#2764b7" font-weight="700" text-anchor="start" class="mono">1. table_put(table, 5, &quot;five&quot;) → True</text>
<rect x="40" y="335" width="1120" height="90" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="60" y="390" font-size="22" fill="#2764b7" font-weight="400" text-anchor="start" class="mono">table[1]</text>
<rect x="240" y="353" width="270" height="54" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="258" y="389" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="mono">[1, &quot;one&quot;]</text>
<rect x="540" y="353" width="270" height="54" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="558" y="389" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="mono">[3, &quot;three&quot;]</text>
<rect x="840" y="353" width="270" height="54" rx="10" fill="#dbf0e8" stroke="#cdd7e4" stroke-width="2"/>
<text x="858" y="389" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="mono">[5, &quot;five&quot;]</text>
<text x="40" y="490" font-size="23" fill="#2764b7" font-weight="700" text-anchor="start" class="mono">2. table_put(table, 3, &quot;THREE&quot;) → False</text>
<rect x="40" y="510" width="1120" height="90" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="60" y="565" font-size="22" fill="#2764b7" font-weight="400" text-anchor="start" class="mono">table[1]</text>
<rect x="240" y="528" width="270" height="54" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="258" y="564" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="mono">[1, &quot;one&quot;]</text>
<rect x="540" y="528" width="270" height="54" rx="10" fill="#fff0d8" stroke="#cdd7e4" stroke-width="2"/>
<text x="558" y="564" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="mono">[3, &quot;THREE&quot;]</text>
<rect x="840" y="528" width="270" height="54" rx="10" fill="#ffffff" stroke="#cdd7e4" stroke-width="2"/>
<text x="858" y="564" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="mono">[5, &quot;five&quot;]</text>
<path d="M1090 260L1090 290" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M1090 435L1090 465" fill="none" stroke="#63768b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="40" y="650" font-size="23" fill="#203047" font-weight="400" text-anchor="start" class="">Ключ 5 добавлен: пар стало три. При замене значения ключа 3 их осталось три.</text>
<text x="40" y="695" font-size="22" fill="#2764b7" font-weight="400" text-anchor="start" class="">Совпала корзина ≠ совпал ключ. Возвращаемый bool сообщает о новом ключе.</text>
</svg>
